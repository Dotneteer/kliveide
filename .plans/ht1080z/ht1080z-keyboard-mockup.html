<!doctype html>
<!--
  HT-1080Z virtual keyboard mockup - for the project author's approval (`.plans/HT1080Z_PLAN.md` §7,
  Phase 4). NOT APPROVED YET.

  Geometry is measured from the keyboard drawing in the HT-1080Z user manual, §4.1 p. 8
  (`_input/ht1080z/docs/ht1080z_hasznalati_utmutato_user_manual_hu.pdf`, PDF page 9), rendered at
  2000 px wide; a key there is about 68 px, which is 100 units here. Each row keeps the drawing's
  start, end and special-key widths; the keys between are spaced evenly, because the drawing is
  hand-made. The printed legends (white) are the drawing's.

  The Hungarian legends (accent colour) are Klive's hints, not printed on the machine (the drawing
  shows none; the /64 is said to have had reminder labels on its digit keys - HARDWARE.md §7.1).
  They follow the extension ROM, as `Ht1080zTyper.ts` does: Series II CLEAR (+SHIFT) with A E U O,
  the /64 SHIFT+@ (`) and then a key. Both need the extension on (SYSTEM, /12288).

  Colours: sampled from a photo of a Series I/II machine, https://frescho.hu/ht-1080z-adatlap/
  (IMG_2481.JPG, 5106 x 3629): cream key caps (#e6dfcb) with near-black legends (#1a1712) in a
  dark charcoal recessed panel (#3f4045), set in an off-white case; PAGE and F1 are small light grey
  keys (#a9a9ac). The function keys (BREAK, CLEAR, NEW LINE, SHIFT, the arrows) are cream like the
  rest. On a light key the hover uses a dark blue, as on the ZX81's white keys (a light highlight
  vanishes on cream). The React component must take every colour from theme tokens (AGENTS.md);
  literal colours are fine in this mockup only.
  Open it directly in a browser; it has no dependencies.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>HT-1080Z keyboard mockup</title>
<style>
  body { margin: 0; padding: 24px; background: #202020; font-family: system-ui, sans-serif; color: #ddd; }
  #kb svg { display: block; width: 100%; max-width: 1400px; height: auto; user-select: none; }
  .key .kb { fill: #e6dfcb; stroke: #b9af95; stroke-width: 1.5; }
  .key.sw .kb { fill: #a9a9ac; stroke: #7d7d82; }
  .key.down .kb, .key.latched .kb { fill: #b5d4f4; }
  .key[data-hz=main] .mz { fill: #185fa5; }
  .key[data-hz=shift] .sz { fill: #185fa5; }
  .key[data-hz=acc] .az { fill: #185fa5; }
  .key [data-z] { cursor: pointer; }
  .key.inert [data-z] { cursor: default; }
  .bar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; font-size: 14px; }
  .bar button { background: #333; color: #ddd; border: 1px solid #555; border-radius: 4px; padding: 4px 10px; cursor: pointer; }
  .bar button.on { background: #3d5e86; border-color: #8ec0f0; }
  .ro { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; margin-top: 12px; max-width: 1400px; }
  .ro span:nth-child(odd) { color: #999; }
  .ro code { font-family: ui-monospace, monospace; }
</style>
</head>
<body>
<div class="bar">Model:
  <button data-m="s1">Series I</button><button data-m="s2" class="on">Series II</button><button data-m="s64">HT-1080Z/64</button>
</div>
<div id="kb"></div>
<div class="ro">
  <span>Zone</span><span id="r-zone">Hover a key or a legend</span>
  <span>Sends</span><span><code id="r-send">-</code></span>
  <span>Types</span><span id="r-res">-</span>
</div>
<script>
// --- Key codes: Ht1080zKeyCode (row * 8 + column of the TRS-80 matrix; PAGE outside it)
const CODE = { At: 0, A: 1, B: 2, C: 3, D: 4, E: 5, F: 6, G: 7, H: 8, I: 9, J: 10, K: 11, L: 12, M: 13, N: 14, O: 15,
  P: 16, Q: 17, R: 18, S: 19, T: 20, U: 21, V: 22, W: 23, X: 24, Y: 25, Z: 26, N0: 32, N1: 33, N2: 34, N3: 35, N4: 36,
  N5: 37, N6: 38, N7: 39, N8: 40, N9: 41, Colon: 42, Semicolon: 43, Comma: 44, Minus: 45, Period: 46, Slash: 47,
  Enter: 48, Clear: 49, Break: 50, Up: 51, Down: 52, Left: 53, Right: 54, Space: 55, Shift: 56, Page: 64, F1: 65 };

// --- The rows, in the drawing's pixels (2000 px wide): y, height, then keys as [name, main, shifted, x?, width?]
// --- Keys without x follow the previous one at the row's even pitch.
const ROWS = [
  { y: 892, h: 66, x: 688, pitch: 70.83, keys: [
    ["N1", "1", "!"], ["N2", "2", '"'], ["N3", "3", "#"], ["N4", "4", "$"], ["N5", "5", "%"], ["N6", "6", "&"],
    ["N7", "7", "'"], ["N8", "8", "("], ["N9", "9", ")"], ["N0", "0", ""], ["Colon", ":", "*"], ["Minus", "−", "="],
    ["Break", "BREAK", "", 1538, 92, "fn"], ["Clear", "CLEAR", "", 1630, 88, "fn"]] },
  { y: 958, h: 70, x: 690, pitch: 68, keys: [
    ["Up", "↑", ""], ["Q", "Q"], ["W", "W"], ["E", "E"], ["R", "R"], ["T", "T"], ["Y", "Y"], ["U", "U"], ["I", "I"],
    ["O", "O"], ["P", "P"], ["At", "@", "\\"], ["Left", "←", "", 0, 0, "fn"], ["Right", "→", "", 0, 0, "fn"]] },
  { y: 1028, h: 68, x: 708, pitch: 67.9, keys: [
    ["Down", "↓", "", 0, 0, "fn"], ["A", "A"], ["S", "S"], ["D", "D"], ["F", "F"], ["G", "G"], ["H", "H"], ["J", "J"],
    ["K", "K"], ["L", "L"], ["Semicolon", ";", "+"], ["Enter", "NEW LINE", "", 1455, 165, "fn"]] },
  { y: 1096, h: 68, x: 808, pitch: 68.2, keys: [
    ["Shift", "SHIFT", "", 672, 136, "fn"], ["Z", "Z"], ["X", "X"], ["C", "C"], ["V", "V"], ["B", "B"], ["N", "N"],
    ["M", "M"], ["Comma", ",", "<"], ["Period", ".", ">"], ["Slash", "/", "?"], ["Shift", "SHIFT", "", 1490, 130, "fn"]] },
  { y: 1164, h: 66, x: 845, pitch: 0, keys: [["Space", "", "", 845, 612]] },
  { y: 832, h: 38, x: 1470, pitch: 0, keys: [["Page", "PAGE", "", 1470, 75, "sw"], ["F1", "F1", "", 1545, 73, "sw"]] }
];

// --- Klive's Hungarian hints per model: the key, then what it types plain and with SHIFT
const ACCENTS = {
  s1: {},
  s2: { A: ["Á", "á"], E: ["É", "é"], U: ["Ü", "ü"], O: ["Ö", "ö"] },
  s64: { A: ["Á", "á"], E: ["É", "é"], I: ["Í", "í"], O: ["Ó", "ó"], U: ["Ú", "ú"], N3: ["Ö", "ö"], N4: ["Ő", "ő"],
    N5: ["Ü", "ü"], N6: ["Ű", "ű"], N7: ["Ω", "ω"], N8: ["∞", "α"], N9: ["■", "√"], B: ["Ψ", "β"], G: ["π", "γ"],
    M: ["λ", "μ"], S: ["Σ", "∫"] }
};

const OX = 660, OY = 820, S = 100 / 68; // --- origin and px-to-unit scale (a key = 100 units)
const VW = (1732 - OX) * S, VH = (1244 - OY) * S;
const LEG = "#1a1712", ACC = "#b5481a", FONT = "Helvetica, Arial, sans-serif";
const esc = (t) => t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const T = (x, y, sz, cls, fill, txt, anchor, z, w) =>
  `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-size="${sz}" class="${cls}" fill="${fill}" text-anchor="${anchor || "middle"}" font-weight="${w || 600}" ${z ? `data-z="${z}"` : ""}>${esc(txt)}</text>`;

let model = "s2";
const latched = { Page: false, F1: false };
const keys = [];

function render() {
  let svg = `<svg viewBox="0 0 ${VW.toFixed(0)} ${VH.toFixed(0)}" xmlns="http://www.w3.org/2000/svg" font-family="${FONT}">` +
    `<rect width="100%" height="100%" rx="10" fill="#e8e2d4"/>` +
    `<rect x="6" y="6" width="${(VW - 12).toFixed(0)}" height="${(VH - 12).toFixed(0)}" rx="8" fill="#3f4045"/>`;
  keys.length = 0;
  ROWS.forEach((row) => {
    let next = row.x;
    row.keys.forEach(([name, main, shifted, kx, kw, kind]) => {
      const x = kx || next, w = kw || row.pitch;
      next = x + w;
      const d = { name, main, shifted, kind, accent: ACCENTS[model][name] };
      keys.push(d);
      const gx = (x - OX) * S, gy = (row.y - OY) * S, W = w * S - 8, H = row.h * S - 8;
      const cls = `key${kind === "sw" ? " sw" : ""}${latched[name] ? " latched" : ""}${name === "F1" ? " inert" : ""}`;
      let s = `<g class="${cls}" data-i="${keys.length - 1}" transform="translate(${(gx + 4).toFixed(1)} ${(gy + 4).toFixed(1)})">`;
      s += `<rect class="kb" data-z="main" rx="7" width="${W.toFixed(1)}" height="${H.toFixed(1)}"/>`;
      const words = main.length > 2;
      if (kind === "sw") s += T(W / 2, H / 2 + 8, 22, "mz", LEG, main, "middle", "main", 700);
      else if (words) {
        const parts = main.split(" ");
        parts.forEach((p, i) => (s += T(W / 2, H / 2 + 8 + (i - (parts.length - 1) / 2) * 24, 21, "mz", LEG, p, "middle", "main", 700)));
      } else if (shifted) {
        s += T(W / 2, H - 16, 34, "mz", LEG, main, "middle", "main");
        s += `<rect data-z="shift" x="${W / 2 - 26}" y="2" width="52" height="42" fill="transparent"/>` + T(W / 2, 38, 30, "sz", LEG, shifted, "middle", "shift");
      } else if (main) s += T(W / 2, H / 2 + 14, 40, "mz", LEG, main, "middle", "main");
      if (d.accent) {
        s += `<rect data-z="acc" x="${W - 46}" y="${H - 34}" width="44" height="32" fill="transparent"/>` +
          T(W - 6, H - 8, 21, "az", ACC, `${d.accent[0]}${d.accent[1]}`, "end", "acc", 700);
      }
      svg += s + "</g>";
    });
  });
  document.getElementById("kb").innerHTML = svg + "</svg>";
  wire();
}

const rz = document.getElementById("r-zone"), rs = document.getElementById("r-send"), rr = document.getElementById("r-res");
const c = (name) => `${name.toUpperCase()} (${CODE[name]})`;
function describe(d, z, btn) {
  if (d.name === "Page") return ["PAGE: a latching key outside the matrix", "toggles the 32-column page", latched.Page ? "right half (columns 32-63) in 32 columns" : "left half (columns 0-31) in 32 columns"];
  if (d.name === "F1") return ["F1: the recorder-motor override", "inert until the tape (Phase 6)", "-"];
  if (d.name === "Shift" && z === "main") return ["SHIFT", c("Shift"), "hold with another key"];
  if (z === "main" && btn === 2 && d.shifted) return ["Main key, right button", `SHIFT (56) + ${c(d.name)}`, d.shifted];
  if (z === "main") return ["Main key, left button (right button adds SHIFT)", c(d.name), d.main || "space"];
  if (z === "shift") return ["Shifted legend", `SHIFT (56) + ${c(d.name)}`, d.shifted === "\\" ? "\\ on the legend; the ROM stores 00h (Series I/II) or ` (60h, the /64)" : d.shifted];
  if (z === "acc") {
    const [plain, sh] = d.accent;
    const ch = btn === 2 ? sh : plain;
    const sends = model === "s2"
      ? `CLEAR (49)${btn === 2 ? " + SHIFT (56)" : ""} held, then ${c(d.name)}`
      : `SHIFT (56) + @ (0), then ${btn === 2 ? "SHIFT (56) + " : ""}${c(d.name)}`;
    return [`Hungarian legend (Klive's hint), ${btn === 2 ? "right" : "left"} button`, sends, `${ch} - needs the extension on (SYSTEM, /12288)`];
  }
  return ["", "", ""];
}
function wire() {
  document.querySelectorAll(".key").forEach((g) => {
    const d = keys[Number(g.dataset.i)];
    g.querySelectorAll("[data-z]").forEach((el) => {
      el.addEventListener("mouseenter", () => { g.dataset.hz = el.dataset.z; const [a, b, r] = describe(d, el.dataset.z, 0); rz.textContent = a; rs.textContent = b; rr.textContent = r; });
      el.addEventListener("mousedown", (e) => {
        if (d.name === "Page") { latched.Page = !latched.Page; render(); }
        else g.classList.add("down");
        const [a, b, r] = describe(d, el.dataset.z, e.button); rz.textContent = a; rs.textContent = b; rr.textContent = r;
      });
    });
    g.addEventListener("mouseleave", () => { delete g.dataset.hz; g.classList.remove("down"); });
    g.addEventListener("mouseup", () => g.classList.remove("down"));
    g.addEventListener("contextmenu", (e) => e.preventDefault());
  });
}
document.querySelectorAll(".bar button").forEach((b) => b.addEventListener("click", () => {
  model = b.dataset.m;
  document.querySelectorAll(".bar button").forEach((x) => x.classList.toggle("on", x === b));
  render();
}));
render();
</script>
</body>
</html>
