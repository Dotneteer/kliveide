name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check ZX Spectrum 48K WASM artifact size
        run: npm run check:sp48-wasm-size

      - name: Run unit and component tests
        run: npm run test:unit
