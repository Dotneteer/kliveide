# Publishes a branch preview of the documentation site.
#
# Why a subfolder of gh-pages rather than a second branch: GitHub Pages for this
# repo is a legacy build served from the root of `gh-pages`
# (`gh api repos/Dotneteer/kliveide/pages`), so there is no second branch a preview
# could be pointed at. The preview therefore lives at
# https://dotneteer.github.io/kliveide/preview/<branch>/ and the production deploy
# in deploy-doc.yml carries `clean-exclude: preview/**` so it can never wipe it.
#
# See .plans/NEXTRA_4_NEXT_16_DOCS_MIGRATION_PLAN.md, Phase 3.

name: GitHub Pages preview deploy

on:
  workflow_dispatch:
  push:
    branches: [dotneteer/update-nextra]

permissions:
  contents: write

concurrency:
  group: docs-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      PREVIEW_PATH: preview/update-nextra

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json

      - name: Install root packages
        run: npm ci

      - name: Install docs packages
        run: npm run doc:install

      - name: Build the docs site for the preview path
        run: npm run doc:build
        env:
          NEXT_PUBLIC_BASE_PATH: /kliveide/${{ env.PREVIEW_PATH }}

      - name: Verify the build against the golden snapshots
        run: npm run doc:check

      - name: Assert the site was built for the right path
        run: |
          if grep -q "\"/kliveide/${PREVIEW_PATH}/_next/" docs/out/index.html; then
            echo "Built for /kliveide/${PREVIEW_PATH} as expected"
          else
            echo "::error::docs/out was not built for /kliveide/${PREVIEW_PATH}; every asset would 404"
            exit 1
          fi

      - name: Disable Jekyll processing
        run: touch docs/out/.nojekyll

      - name: Upload the built site
        uses: actions/upload-artifact@v4
        with:
          name: docs-preview
          path: docs/out
          retention-days: 7

      # GitHub Pages' legacy Jekyll build strips paths beginning with `_`, which
      # would silently delete _next/ (and _pagefind/ once Phase 5 lands). The
      # .nojekyll written above lands inside the preview subfolder, which does NOT
      # disable Jekyll for the branch - only a root one does. Fail loudly rather
      # than publish a preview that renders unstyled.
      - name: Require a root .nojekyll on gh-pages
        run: |
          git fetch origin gh-pages --depth=1
          if git ls-tree --name-only origin/gh-pages | grep -qx '.nojekyll'; then
            echo "gh-pages has a root .nojekyll"
          else
            echo "::error::gh-pages is missing a root .nojekyll; _next/ would be stripped by Jekyll"
            exit 1
          fi

      # clean: false is load-bearing, not laziness. The deploy action's docs do not
      # state whether `clean` is scoped to target-folder or to the whole branch, and
      # the production site lives at the root of this same branch. Do not enable it.
      - name: Deploy preview 🚀
        uses: JamesIves/github-pages-deploy-action@v4.6.4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: docs/out
          target-folder: ${{ env.PREVIEW_PATH }}
          clean: false
          commit-message: "docs preview: ${{ env.PREVIEW_PATH }} @ ${{ github.sha }}"

      - name: Preview URL
        run: echo "Published to https://dotneteer.github.io/kliveide/${PREVIEW_PATH}/"
