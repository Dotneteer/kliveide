# Builds the Nextra documentation site and publishes it to GitHub Pages.
#
# The docs site is an isolated npm package under docs/ with its own lockfile, so it
# needs a second install step. See .plans/NEXTRA_4_NEXT_16_DOCS_MIGRATION_PLAN.md.

name: GitHub Pages deploy

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: docs-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE_PATH: /kliveide

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for all branches and tags

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json

      - name: Install root packages
        run: npm ci

      - name: Install docs packages
        run: npm run doc:install

      - name: Build the docs site
        run: npm run doc:build
        env:
          # docs/.env.production supplies the same value, but setting it here
          # makes the deployment path explicit and symmetric with the preview
          # workflow, rather than depending on dotenv loading order in CI.
          NEXT_PUBLIC_BASE_PATH: ${{ env.BASE_PATH }}

      - name: Verify the build against the golden snapshots
        run: npm run doc:check

      - name: Assert the site was built for the right path
        run: |
          if grep -q "\"${BASE_PATH}/_next/" docs/out/index.html; then
            echo "Built for ${BASE_PATH} as expected"
          else
            echo "::error::docs/out was not built for ${BASE_PATH}; every asset would 404"
            exit 1
          fi

      - name: Disable Jekyll processing
        run: touch docs/out/.nojekyll

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4.6.4
        with:
          git-config-name: https://dotneteer.github.io/kliveide
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: gh-pages # The branch the action will deploy to
          FOLDER: docs/out # The folder the action will deploy to
          # Never let a production deploy wipe an in-flight branch preview
          # published by deploy-doc-preview.yml.
          clean-exclude: |
            preview/**
