# Builds the Nextra documentation site and publishes it to GitHub Pages.
#
# The docs site is an isolated npm package under docs/ with its own lockfile, so it
# needs a second install step. See .plans/NEXTRA_4_NEXT_16_DOCS_MIGRATION_PLAN.md.

name: GitHub Pages deploy

# release.yml also calls it (workflow_call) once a release is published, so the landing page picks up
# the new version and download links at once (.plans/RELEASE_AUTOMATION_PLAN.md §5). Its dry run
# passes deploy: false and the would-be tag, and nothing is deployed.

on:
  push:
    branches: [master]
  workflow_call:
    inputs:
      deploy:
        description: Deploy the built site (false for the release dry run)
        type: boolean
        required: false
        default: true
      release-tag:
        description: Build as if this release tag existed (KLIVE_SITE_RELEASE_TAG; the dry run)
        type: string
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    # One production deploy at a time, whether from a master push or a release; they queue, never
    # race. A dry run builds in its own group and deploys nothing. (`inputs.deploy` is null on a
    # push, and null == false is true in Actions expressions, hence the comparison as text.)
    concurrency:
      group: ${{ format('{0}', inputs.deploy) == 'false' && format('docs-dry-run-{0}', github.run_id) || 'docs-production' }}
      cancel-in-progress: false

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Fetch all history for all branches and tags

      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json

      - name: Install root packages
        run: npm ci

      - name: Install docs packages
        run: npm run doc:install

      - name: Build the docs site
        env:
          KLIVE_SITE_RELEASE_TAG: ${{ inputs.release-tag }}
        run: npm run doc:build

      - name: Verify the build against the golden snapshots
        run: npm run doc:check

      - name: Disable Jekyll processing
        run: touch docs/out/.nojekyll

      - name: Deploy 🚀
        # A push has no inputs, and null == false is true in Actions expressions, so compare as text
        if: ${{ format('{0}', inputs.deploy) != 'false' }}
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          git-config-name: https://kliveide.net
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: gh-pages # The branch the action will deploy to
          FOLDER: docs/out # The folder the action will deploy to
          # The custom domain survives every deploy because docs/public/CNAME is
          # exported into docs/out; never let a production deploy wipe an
          # in-flight branch preview
          # published by deploy-doc-preview.yml.
          clean-exclude: |
            preview/**
