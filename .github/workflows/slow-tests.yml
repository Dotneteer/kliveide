# The slow end-to-end tier (`e2e-slow`, `build/e2e-tests.ts`): the files carved out of the fast
# tiers because they cost far more than they add to an everyday run.
#
# Run it by hand ("Run workflow", any branch) when a plan is about to complete and before
# `npm run release:prepare` - the GitHub counterpart of `npm run test:slow`. Push, pull requests and
# the Release workflow never run it.

name: Slow tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slow:
    name: slow (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build all WASM machine cores
        run: npm run build:all-wasm

      # The ZX Spectrum Next SD base cards are not in git (dev/plans/NEXT_SD_CARDS_PLAN.md D-6): fetched
      # from kliveide.net and checked against the manifest, cached until the manifest or the fetch changes.
      - name: Cache the ZX Spectrum Next SD cards
        uses: actions/cache@v6
        with:
          path: .local/next-sd
          key: next-sd-${{ runner.os }}-${{ hashFiles('src/common/zxnext/nextRomSets.json', 'dev/scripts/next-sd-fetch.cjs', 'dev/scripts/next-sd/cards.cjs') }}

      - name: Fetch the ZX Spectrum Next SD cards
        run: npm run next-sd:fetch

      - name: Run the slow tier
        run: npx vitest run --config build/vitest.config.ts --project=e2e-slow --shard=${{ matrix.shard }}/3
        env:
          NODE_OPTIONS: --max-old-space-size=4096
