            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-builder-${{ runner.os }}-${{ github.job }}-${{ steps.electron.outputs.version }}

      - name: Package Electron app on linux
        shell: bash
        # Retry only the packaging step: a failed download should not cost a
        # full rebuild, and an outage usually clears within a minute or two.
        run: |
          for attempt in 1 2 3 4; do
            npm run package:linux && exit 0
            if [ "$attempt" -lt 4 ]; then
              delay=$((attempt * 30))
              echo "::warning::Packaging attempt $attempt failed; retrying in ${delay}s"
              sleep "$delay"
            fi
          done
          echo "::error::Packaging failed after 4 attempts"
          exit 1

      - name: Add install Emulator install kit to artifacts
        uses: actions/upload-artifact@v7
        with:
          name: install-kit-linux
          path: artifacts/*x86_64.AppImage

