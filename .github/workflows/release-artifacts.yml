name: Build artifacts

on: workflow_dispatch

jobs:
  build-on-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install npm dependencies
        run: npm run bootstrap:ci

      - name: Build Electron app on Windows
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run build:win

      - name: Add install Emulator install kit to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: install-kit-winx86
          path: |
            artifacts/*.exe
            artifacts/*.msi

  build-on-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install npm dependencies
        run: npm run bootstrap:ci

      - name: Build Electron app on linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run build:linux

      - name: Add install Emulator install kit to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: install-kit-linux
          path: artifacts/*x86_64.AppImage

  build-on-linux-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install npm dependencies
        run: npm run bootstrap:ci

      - name: Build Electron app on linux ARM64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run build:linux:arm64

      - name: Add install Emulator install kit to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: install-kit-linux-arm64
          path: artifacts/*arm64.AppImage

  build-on-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Configure WASM compiler
        shell: bash
        run: |
          set -euo pipefail
          find_llvm() {
            for formula in llvm@20 llvm llvm@19 llvm@18 llvm@17; do
              prefix="$(brew --prefix "$formula" 2>/dev/null || true)"
              if [ -n "$prefix" ] && [ -x "$prefix/bin/clang" ]; then
                echo "$prefix"
                return 0
              fi
            done
            return 1
          }
          LLVM_PREFIX="$(find_llvm || true)"
          if [ -z "$LLVM_PREFIX" ]; then
            echo "No Homebrew LLVM found on the runner; installing llvm@20 (this may take a few minutes)."
            brew install llvm@20
            LLVM_PREFIX="$(brew --prefix llvm@20)"
          fi
          echo "Using LLVM at $LLVM_PREFIX"
          "$LLVM_PREFIX/bin/clang" --version
          # Fail here (not deep inside the app build) if this clang cannot emit wasm32.
          printf 'int wasmProbe(void) { return 0; }\n' > "$RUNNER_TEMP/wasm-probe.c"
          "$LLVM_PREFIX/bin/clang" --target=wasm32 -nostdlib -Wl,--no-entry \
            -Wl,--export=wasmProbe -o "$RUNNER_TEMP/wasm-probe.wasm" "$RUNNER_TEMP/wasm-probe.c"
          echo "$LLVM_PREFIX/bin" >> "$GITHUB_PATH"

      - name: Install npm dependencies
        run: npm run bootstrap:ci

      - name: Build Electron app on Mac
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run build:mac

      - name: Add install Emulator install kit to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: install-kit-mac
          path: artifacts/*x64.pkg

  build-on-mac-arm64:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Configure WASM compiler
        shell: bash
        run: |
          set -euo pipefail
          find_llvm() {
            for formula in llvm@20 llvm llvm@19 llvm@18 llvm@17; do
              prefix="$(brew --prefix "$formula" 2>/dev/null || true)"
              if [ -n "$prefix" ] && [ -x "$prefix/bin/clang" ]; then
                echo "$prefix"
                return 0
              fi
            done
            return 1
          }
          LLVM_PREFIX="$(find_llvm || true)"
          if [ -z "$LLVM_PREFIX" ]; then
            echo "No Homebrew LLVM found on the runner; installing llvm@20 (this may take a few minutes)."
            brew install llvm@20
            LLVM_PREFIX="$(brew --prefix llvm@20)"
          fi
          echo "Using LLVM at $LLVM_PREFIX"
          "$LLVM_PREFIX/bin/clang" --version
          # Fail here (not deep inside the app build) if this clang cannot emit wasm32.
          printf 'int wasmProbe(void) { return 0; }\n' > "$RUNNER_TEMP/wasm-probe.c"
          "$LLVM_PREFIX/bin/clang" --target=wasm32 -nostdlib -Wl,--no-entry \
            -Wl,--export=wasmProbe -o "$RUNNER_TEMP/wasm-probe.wasm" "$RUNNER_TEMP/wasm-probe.c"
          echo "$LLVM_PREFIX/bin" >> "$GITHUB_PATH"

      - name: Install npm dependencies
        run: npm run bootstrap:ci

      - name: Build Electron app on Mac ARM64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run build:mac:arm64

      - name: Add install Emulator install kit to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: install-kit-mac-arm64
          path: artifacts/*arm64.pkg
