<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!--
    "Continue" = the play glyph from play.svg with a pause bar in front of it.

    One bar, not the two of pause.svg: that is what the stock "debug-continue"
    this replaces uses, and two bars do not fit beside the triangle without
    merging at 20px. The bar is filled rather than stroked - at this width a
    stroked rect would have no interior left anyway, and it matches how the bug
    is drawn in debug.svg.

    The gap between the bar and the triangle is 2.3 units. At the earlier full
    triangle size it was 1.1, which merged into a single blob at 20px.

    The bar spans y 3.35..20.65, which is the triangle's VISIBLE height, not its
    path bounding box (y 4.349..19.651). The difference is the stroke: the
    triangle is drawn with a rendered weight of 2, so its outline reaches one
    unit beyond the path on each side. Matching the path box instead would leave
    the bar looking a unit short at both ends.
  -->

  <!-- Pause bar -->
  <rect x="0.4" y="3.35" width="2.2" height="17.3" rx="1.1" fill="currentColor" stroke="none"/>

  <!-- The Lucide play path, scaled 0.85 about translate(1.65,1.8). The group
       scale shrinks the stroke too, so stroke-width is pre-divided by 0.85 to
       keep the rendered weight at the Lucide standard of 2. -->
  <g transform="translate(1.65,1.8) scale(0.85)" stroke-width="2.353">
    <path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/>
  </g>
</svg>
