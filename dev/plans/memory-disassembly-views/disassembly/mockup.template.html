<!--
  MOCKUP of a modernized "Disassembly" document for Klive IDE, the companion of the Memory view
  mockup (dev/plans/memory-disassembly-views/memory/): the same toolbar idiom, map bar, partition row, bank map
  and inspector column, over a listing instead of a hex dump. Self-contained: open it in a browser.
  Machines (the Machine menu at the top right, mockup only): ZX Spectrum 128K, Cambridge Z88,
  ZX Spectrum Next (2 MB / 4 MB KS3).
  Real: the ROM pages (Spectrum ROM 0/1, OZ 4.7 banks $00/$1F, Next ROM R0) with their labels, data
  regions, comments and synopses from Klive's own ROM sidecars; the ZX Spectrum's system variable
  names; the NextReg names. Simulated: RAM, registers, paging, the user's program and labels, the
  heat map, breakpoints. The decoder (dev/plans/memory-disassembly-views/shared/z80.js) is mockup code.

<script>
const ROMS = __ROMS__;
const SYSVARS = __SYSVARS__;
const NEXTREGS = __NEXTREGS__;
/*__SHARED_MACHINES__*/
/*__SHARED_Z80__*/
const ptrRegs = () => Object.entries(M.regs).filter(([r]) => r !== "AF");

/* =====================================================================================
 * View state and addressing. A partition shown on its own is disassembled at an origin, an 8K
 * boundary, so its addresses are the ones its code runs at.
 * ===================================================================================== */
const ui = { radix: "hex", bytes: true, tstates: true, ann: true, sys: true, flow: true, heat: "off", followPc: true,
  cursor: 0, anchor: null, found: [], foundIdx: -1, recent: [], bps: new Map(), comments: {}, flash: null };
const view = { mode: "64k", part: null, origin: 0 };
const ROW_H = 22, LANES = 8, LANE_W = 6;
/** A jump longer than this many rows is drawn as a stub at each end, not as a line across the listing */
const LONG_JUMP = 48;
const scroller = document.getElementById("scroller"), spacerBox = document.getElementById("spacerBox");
let L = { rows: [], starts: [], edges: [], xrefs: new Map() };

const regionAt = (a) => M.regions.find((r) => a >= r.start && a < r.start + r.len);
const viewStart = () => (view.mode === "64k" ? 0 : view.origin);
const viewSize = () => (view.mode === "64k" ? 0x10000 : M.byId.get(view.part).size);
function locate(a) {
  if (view.mode === "64k") { const r = regionAt(a & 0xffff); return [r.part, r.off + ((a & 0xffff) - r.start)]; }
  return [view.part, a - view.origin];
}
const inView = (a) => a >= viewStart() && a < viewStart() + viewSize();
const readAt = (a) => { if (!inView(a)) return null; const [p, o] = locate(a); const s = M.store(p); return s && o >= 0 && o < s.length ? s[o] : null; };
const cpuAddrOf = (part, off) => { for (const r of M.regions) if (r.part === part && off >= r.off && off < r.off + r.len) return r.start + off - r.off; return undefined; };
/** A view address as the CPU sees it now, or undefined when its partition is not paged in there */
const cpuOf = (a) => (view.mode === "64k" ? a : cpuAddrOf(view.part, a - view.origin));
/** A CPU address as this view shows it, or undefined */
const viewOfCpu = (c) => { if (view.mode === "64k") return c; const r = regionAt(c); return r.part === view.part ? view.origin + r.off + c - r.start : undefined; };
const pagedSlots = (part) => M.regions.map((r, i) => (r.part === part ? i : -1)).filter((i) => i >= 0);
const keyOf = (a) => { const [p, o] = locate(a); return p + ":" + o; };
function labelAt(a) {
  const [p, o] = locate(a);
  if (ui.ann) { const rl = M.romLabels(p, o); if (rl) return { name: rl[0], rom: true }; }
  const c = cpuOf(a); const ul = c !== undefined ? M.userLabels[c] : undefined;
  return ul ? { name: ul } : undefined;
}
/** A label for a CPU address operand, looked up where that address lives now */
function nameOfCpu(c, kind) {
  const r = regionAt(c), p = r.part, o = r.off + c - r.start;
  if (ui.ann) { const rl = M.romLabels(p, o); if (rl) return { name: rl[0], cls: "go" }; }
  if (M.userLabels[c]) return { name: M.userLabels[c], cls: "go" };
  if (kind === "data" && ui.sys && M.sysvars[c]) return { name: M.sysvars[c], cls: "sv", sysvar: true };
  return undefined;
}
const fmtA = (a) => (ui.radix === "hex" ? "$" + h4(a) : String(a).padStart(5, "0"));
const fmtN = (v, w = 4) => (ui.radix === "hex" ? "$" + v.toString(16).toUpperCase().padStart(w, "0") : String(v));

/* =====================================================================================
 * The listing: separators where the paging changes, synopses and labels, data regions
 * (the ROM sidecar's and the user's), and instructions.
 * ===================================================================================== */
function dataRegionAt(a) {
  const [p, o] = locate(a);
  if (ui.ann) { const r = M.romRegion(p, o); if (r) return { end: a + (r.end - o), type: r.decode === "fill" ? "fill" : r.decode === "defc" ? "text" : "bytes" }; }
  const c = cpuOf(a);
  if (c !== undefined) { const u = M.userRegions?.find((g) => c >= g.start && c <= g.end); if (u) return { end: a + (u.end - c), type: u.type }; }
  return undefined;
}
function buildListing() {
  const rows = [], start = viewStart(), end = start + viewSize();
  let a = start;
  while (a < end) {
    const [p] = locate(a), part = M.byId.get(p);
    if (view.mode === "64k") {
      const r = regionAt(a);
      if (r.start === a) rows.push({ kind: "sep", a, r });
      if (part.kind === "empty") { rows.push({ kind: "empty", a, len: r.len, text: `${part.note ?? "Nothing here"}: $${h4(r.start)}–$${h4(r.start + r.len - 1)} reads the floating bus` }); a = r.start + r.len; continue; }
    } else if (part.kind === "empty") { rows.push({ kind: "empty", a, len: viewSize(), text: `${part.note ?? "Empty"}: nothing to disassemble` }); break; }
    const lab = labelAt(a);
    if (lab) {
      const [pp, oo] = locate(a); const n = ui.ann ? M.romNote(pp, oo) : undefined;
      if (n?.s) rows.push({ kind: "syn", a, text: n.s });
      rows.push({ kind: "label", a, name: lab.name, rom: lab.rom });
    }
    // --- No row may run past the next paging boundary
    const limit = view.mode === "64k" ? regionAt(a).start + regionAt(a).len : end;
    const dr = dataRegionAt(a);
    if (dr) {
      const regionEnd = Math.min(dr.end + 1, limit, end);
      let len, text;
      const bytesAt = (n) => Array.from({ length: n }, (_, i) => readAt(a + i) ?? 0);
      if (dr.type === "fill") { len = regionEnd - a; const v = readAt(a) ?? 0; text = `<span class="dir">.defs</span> ${len}, ${fmtN(v, 2)}`; }
      else if (dr.type === "text") {
        len = 0; let s = "";
        while (a + len < regionEnd && len < 24) { const v = readAt(a + len) ?? 0; len++; s += v >= 32 && v < 127 ? String.fromCharCode(v) : ""; if (v & 0x80) break; }
        text = `<span class="dir">.defm</span> "${esc(s)}"`;
      } else if (dr.type === "words") { len = Math.min(8, regionEnd - a) & ~1 || 1; const b = bytesAt(len); text = `<span class="dir">.defw</span> ` + Array.from({ length: len >> 1 }, (_, i) => { const w = b[2 * i] | (b[2 * i + 1] << 8); const n = nameOfCpu(w, "code"); return n ? `<span class="go" data-go="${w}">${esc(n.name)}</span>` : fmtN(w); }).join(", "); }
      else { len = Math.min(8, regionEnd - a); text = `<span class="dir">.defb</span> ` + bytesAt(len).map((v) => fmtN(v, 2)).join(", "); }
      rows.push({ kind: "data", a, len, text, plain: text.replace(/<[^>]+>/g, "") });
      a += len; continue;
    }
    const d = Z80.decode((i) => readAt(a + i) ?? 0, cpuOf(a) ?? a, !!M.z80n);
    rows.push({ kind: "instr", a, len: d.len, d });
    a += d.len;
  }
  // --- Index, cross-references and the flow edges with their lanes
  const starts = [], xrefs = new Map(), edges = [];
  rows.forEach((r, i) => { if (r.kind === "instr" || r.kind === "data") starts.push(i); });
  const rowOfAddr = (va) => { let lo = 0, hi = starts.length - 1, best = -1; while (lo <= hi) { const m = (lo + hi) >> 1; if (rows[starts[m]].a <= va) { best = m; lo = m + 1; } else hi = m - 1; } return best < 0 ? -1 : starts[best]; };
  rows.forEach((r, i) => {
    if (r.kind !== "instr") return;
    // --- A reference is a jump or call target, or a memory operand: a 16-bit immediate is as often
    // --- a count as an address, so it is named (LAST_K) but not counted as a reference
    for (const m of r.d.text.matchAll(/(\(?)\u0001(\d+)\u0002(code|data)\u0003/g)) {
      if (m[3] === "data" && !m[1]) continue;
      const t = +m[2]; const k = m[3];
      if (!xrefs.has(t)) xrefs.set(t, []);
      xrefs.get(t).push({ row: i, kind: r.d.kind ?? k });
    }
    if ((r.d.kind === "jr" || r.d.kind === "jp" || r.d.kind === "djnz") && r.d.target !== undefined) {
      const tv = viewOfCpu(r.d.target);
      const tr = tv !== undefined && inView(tv) ? rowOfAddr(tv) : -1;
      edges.push({ src: i, dst: tr, up: r.d.target < (cpuOf(r.a) ?? r.a), cond: !!r.d.cond, target: r.d.target });
    }
  });
  // --- Lanes: shorter spans inside, each lane free of overlaps where it can be
  const lanes = Array.from({ length: LANES }, () => []);
  edges.forEach((e) => { if (e.dst >= 0 && Math.abs(e.src - e.dst) > LONG_JUMP) { e.far = e.dst; e.dst = -1; } });
  edges.filter((e) => e.dst >= 0).sort((x, y) => Math.abs(x.src - x.dst) - Math.abs(y.src - y.dst)).forEach((e) => {
    const lo = Math.min(e.src, e.dst), hi = Math.max(e.src, e.dst);
    let lane = lanes.findIndex((l) => l.every(([a, b]) => hi < a || lo > b));
    if (lane < 0) lane = LANES - 1;
    lanes[lane].push([lo, hi]); e.lane = lane;
  });
  L = { rows, starts, edges, xrefs, rowOfAddr };
}

/* =====================================================================================
 * Verdicts: what a branch will do, judged against the CPU's flags now. Certain only at PC.
 * ===================================================================================== */
const regB = () => M.regs.BC >> 8;
const regF = () => M.regs.AF & 0xff;
function readCpuWord(c) { const r1 = regionAt(c), r2 = regionAt((c + 1) & 0xffff); const s1 = M.store(r1.part), s2 = M.store(r2.part); return ((s1?.[r1.off + c - r1.start] ?? 0) | ((s2?.[r2.off + ((c + 1) & 0xffff) - r2.start] ?? 0) << 8)); }
function verdict(row) {
  const d = row.d; if (!d.kind) return null;
  const c = cpuOf(row.a); const atPc = c === M.regs.PC;
  const taken = d.cond ? Z80.condMet(d.cond, regF(), regB()) : true;
  let target = d.target;
  if (d.kind === "ret") target = atPc && view.mode === "64k" ? readCpuWord(M.regs.SP) : undefined;
  if (d.kind === "jp" && d.indirect) target = atPc && d.indirect !== "port" ? M.regs[d.indirect.toUpperCase()] : undefined;
  const t = d.t.length > 1 ? (taken ? d.t[0] : d.t[1]) : d.t[0];
  let glyph, dir;

  if (d.kind === "djnz") M.regs.BC = ((((M.regs.BC >> 8) - 1) & 0xff) << 8) | (M.regs.BC & 0xff);
  if (d.kind && taken) {
    if (d.kind === "call" || d.kind === "rst") { M.regs.SP = (M.regs.SP - 2) & 0xffff; next = d.target; }
    else if (d.kind === "ret") { next = readCpuWord(M.regs.SP); M.regs.SP = (M.regs.SP + 2) & 0xffff; }
    else if (d.target !== undefined) next = d.target;
  }
  M.regs.PC = next;
  const r = regionAt(next); M.addHeat(r.part, r.off + next - r.start, 0, 1);
  if (ui.followPc) goCpu(M.regs.PC, false); else { renderMap(); renderRows(); renderInsp(); }
  toast(`Stepped to $${h4(M.regs.PC)}`);
}
document.getElementById("stepBtn").addEventListener("click", simulateStep);

function loadMachine(id) {
  M = instantiate(MACHINES[id]());
  view.mode = "64k"; view.part = null; ui.anchor = null; ui.found = []; ui.bps = new Map(); ui.comments = {};
  document.getElementById("findCnt").textContent = ""; popFilter.value = ""; pop.hidden = true;
  ui.recent = M.big ? (id === "z88" ? ["1F", "41", "80"] : ["R1", "12", "M3"]) : [];
  // --- A few breakpoints, as a session would have them
  const pv = M.regs.PC; ui.bps.set(keyOf(pv - 3), { type: "exec" }); ui.bps.set(keyOf(pv + 4), { type: "once" });
  const [rp] = locate(0x10); ui.bps.set(rp + ":" + 0x10, { type: "exec", cond: "a == $0D" });
  ui.cursor = pv;
  render();
  requestAnimationFrame(() => { goCpu(M.regs.PC, false); scroller.focus(); });
}
document.getElementById("machineSel").addEventListener("change", (e) => loadMachine(e.target.value));
document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
document.querySelectorAll("#themeSeg button").forEach((b) => b.classList.toggle("on", b.dataset.v === document.documentElement.dataset.theme));
loadMachine("sp128");
</script>
