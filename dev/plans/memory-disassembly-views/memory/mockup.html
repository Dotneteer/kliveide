<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory View Mockup</title>
<!--
  MOCKUP of a modernized "Machine Memory" document for Klive IDE. Self-contained: open it in a
  browser. Three machines, switched with the Machine menu at the top right (mockup only):
    - ZX Spectrum 128K: 10 partitions, listed in full.
    - Cambridge Z88: 256 banks in four card slots.
    - ZX Spectrum Next: 247 partitions (503 on a 4 MB KS3 board).
  Real: the ROM pages embedded by build-mockup.cjs (Spectrum ROM 0/1, OZ 4.7 banks $00/$1F, Next
  ROM R0) and their labels from Klive's own ROM sidecars. Simulated: RAM, cards, registers, paging,
  the user's labels, the heat map and the "changed since the previous stop" marks.
  Generated by dev/plans/memory-disassembly-views/memory/build-mockup.cjs from mockup.template.html.
-->
<style>
/* Shared by the Memory and Disassembly view mockups: tokens, chrome, toolbar, map bar, bank map, inspector. */
:root {
  --canvas:#141517; --chrome:#1b1d21; --panel:#17191c; --raised:#202329; --overlay:#22262d; --hover:#24272e;
  --active:#2a2e36; --border-subtle:#24272b; --border:#2e3238; --border-strong:#3d424a;
  --text:#e4e6ea; --text-2:#949aa4; --text-3:#7f8690; --text-dis:#5a606a;
  --accent:#45A5E6; --accent-2:#939CF0; --on-accent:#0e0f11;
  --accent-subtle:color-mix(in srgb, var(--accent) 18%, transparent);
  --accent-border:color-mix(in srgb, var(--accent) 55%, transparent);
  --accent-2-subtle:color-mix(in srgb, var(--accent-2) 18%, transparent);
  --accent-2-border:color-mix(in srgb, var(--accent-2) 60%, transparent);
  --changed:#e6b450;
  --warn:#e6b450; --warn-subtle:color-mix(in srgb, var(--warn) 16%, transparent);
  --success:#4fc27a; --error:#f0716b; --info:#45A5E6;
  --heat-exec:#4fc27a; --heat-read:#45A5E6; --heat-write:#f0716b;
  --even:color-mix(in srgb, var(--text) 2.5%, transparent);
  --k-rom:color-mix(in srgb, var(--text-3) 22%, transparent);
  --k-ram:color-mix(in srgb, var(--accent) 22%, transparent);
  --k-card:color-mix(in srgb, var(--accent-2) 26%, transparent);
  --k-div:color-mix(in srgb, var(--success) 20%, transparent);
  --mono:"Iosevka","JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
  --row:22px;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --canvas:#ffffff; --chrome:#f1f2f4; --panel:#f7f8f9; --raised:#ffffff; --overlay:#ffffff; --hover:#eceef1;
  --active:#e3e6ea; --border-subtle:#e6e8eb; --border:#d9dce1; --border-strong:#c3c8cf;
  --text:#1d2025; --text-2:#545a64; --text-3:#666c76; --text-dis:#a3a8b0;
  --accent:#0A6FB8; --accent-2:#0A18B8; --on-accent:#ffffff;
  --changed:#9a6700; --warn:#9a6700;
  --success:#1c7a43; --error:#c0392b; --info:#0A6FB8;
  --heat-exec:#1c9a53; --heat-read:#0A6FB8; --heat-write:#d0453c;
  color-scheme: light;
}
* { box-sizing:border-box; }
html, body { margin:0; height:100%; }
body { background:var(--canvas); color:var(--text); font:13px/1.45 var(--sans); overflow:hidden; }
button, input, select { font:inherit; color:inherit; }

.ide { display:grid; grid-template-rows:34px 1fr 22px; height:100vh; }
.tabs { display:flex; align-items:flex-end; background:var(--chrome); border-bottom:1px solid var(--border); padding-left:8px; gap:1px; }
.tab { padding:6px 14px; color:var(--text-3); font-size:12px; border:1px solid transparent; border-bottom:none; border-radius:6px 6px 0 0; white-space:nowrap; }
.tab.on { background:var(--canvas); color:var(--text); border-color:var(--border); margin-bottom:-1px; }
.tab .dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--accent); margin-right:7px; vertical-align:1px; }
.tabs .mock { margin-left:auto; display:flex; gap:8px; align-items:center; padding:0 10px 5px; font-size:11px; color:var(--text-3); }
.status { background:var(--chrome); border-top:1px solid var(--border); display:flex; gap:18px; align-items:center; padding:0 10px; font-size:11px; color:var(--text-3); white-space:nowrap; overflow:hidden; }
.status b { color:var(--text-2); font-weight:500; }
.spacer { flex:1; }

.doc { display:grid; grid-template-rows:auto auto 1fr; min-height:0; }

/* toolbar */
.toolbar { display:flex; align-items:center; gap:10px; padding:6px 12px; background:var(--chrome); border-bottom:1px solid var(--border); flex-wrap:wrap; min-height:38px; }
.lbl { font-size:11px; color:var(--text-3); white-space:nowrap; }
.seg { display:inline-flex; border:1px solid var(--border-strong); border-radius:5px; overflow:hidden; height:24px; flex:0 0 auto; }
.seg button { border:none; background:transparent; padding:0 9px; cursor:pointer; font-size:12px; color:var(--text-2); white-space:nowrap; }
.seg button + button { border-left:1px solid var(--border-strong); }
.seg button.on { background:var(--accent); color:var(--on-accent); font-weight:600; }
.seg button:hover:not(.on) { background:var(--hover); color:var(--text); }
.field { display:inline-flex; align-items:center; height:24px; border:1px solid var(--border-strong); border-radius:5px; background:var(--canvas); padding:0 6px; gap:6px; }
.field:focus-within { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-subtle); }
.field input { border:none; background:transparent; outline:none; font-family:var(--mono); font-size:12px; width:14ch; }
.field .k { font-size:11px; color:var(--text-3); }
.field.find input { width:20ch; }
.field .nav { border:none; background:none; color:var(--text-3); cursor:pointer; padding:0 2px; font-size:12px; }
.field .nav:hover { color:var(--text); }
.field .cnt { font-size:11px; color:var(--text-3); font-family:var(--mono); white-space:nowrap; }
.check { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--text-2); cursor:pointer; user-select:none; white-space:nowrap; }
.check input { accent-color:var(--accent); margin:0; }
.btn { height:24px; padding:0 9px; border-radius:5px; border:1px solid var(--border-strong); background:var(--raised); cursor:pointer; font-size:12px; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
.btn:hover { background:var(--hover); }
.btn:disabled { opacity:.5; cursor:default; }
.btn.primary { background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:600; }
.sel { height:24px; border:1px solid var(--border-strong); border-radius:5px; background:var(--canvas); font-size:12px; padding:0 4px; }
.vsep { width:1px; height:18px; background:var(--border); }

/* memory map bar */
.mapbar { padding:8px 12px; border-bottom:1px solid var(--border); background:var(--panel); display:grid; grid-template-columns:9ch 1fr; gap:7px 12px; align-items:center; position:relative; }
.mapbar > .lbl { text-transform:uppercase; letter-spacing:.6px; font-size:10.5px; }
.slots { position:relative; display:grid; gap:3px; height:38px; margin-top:12px; }
.slot { position:relative; border-radius:5px; border:1px solid var(--border); background:var(--raised); cursor:pointer; overflow:hidden; display:flex; flex-direction:column; justify-content:center; padding:0 7px; font-family:var(--mono); font-size:11px; min-width:0; }
.slot:hover { border-color:var(--accent-border); }
.slot.rom { background:repeating-linear-gradient(135deg, transparent 0 6px, color-mix(in srgb, var(--text-3) 8%, transparent) 6px 7px), var(--raised); }
.slot.empty { border-style:dashed; background:transparent; }
.slot .sa { color:var(--text-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:10px; }
.slot .sb { color:var(--text); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.slot .sb small { font-weight:400; color:var(--text-3); margin-left:5px; font-family:var(--sans); }
.slot .heatline { position:absolute; left:0; right:0; bottom:0; height:3px; display:flex; }
.slotcap { position:absolute; top:-14px; font-size:9.5px; color:var(--text-3); font-family:var(--mono); white-space:nowrap; letter-spacing:.3px; }
.viewport { position:absolute; top:-3px; bottom:-3px; border:2px solid var(--accent); border-radius:4px; pointer-events:none; box-shadow:0 0 0 1px var(--canvas); }
.tick { position:absolute; top:-2px; width:2px; height:42px; background:var(--accent-2); pointer-events:none; }
.parts { display:flex; flex-wrap:wrap; gap:4px; align-items:center; }
.parts .grp { font-size:10.5px; color:var(--text-3); margin:0 2px 0 6px; }
.parts .grp:first-child { margin-left:0; }
.chip { font-family:var(--mono); font-size:11px; height:22px; padding:0 8px; border-radius:11px; border:1px solid var(--border); background:transparent; color:var(--text-2); cursor:pointer; display:inline-flex; align-items:center; gap:5px; white-space:nowrap; }
.chip:hover { border-color:var(--accent-border); color:var(--text); }
.chip.on { background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:600; }
.chip .in { font-size:9.5px; padding:0 4px; border-radius:6px; background:var(--accent-subtle); color:var(--accent); font-family:var(--sans); }
.chip.on .in { background:color-mix(in srgb, var(--on-accent) 22%, transparent); color:var(--on-accent); }
.chip.rom { border-style:dashed; }
.chip.mapbtn { border-radius:5px; border-color:var(--border-strong); background:var(--raised); color:var(--text); font-family:var(--sans); }
.chip.mapbtn b { font-family:var(--mono); color:var(--text-3); font-weight:400; }
.chip.mapbtn.open { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-subtle); }
.regs { display:flex; flex-wrap:wrap; gap:4px; }
.reg { font-family:var(--mono); font-size:11px; height:22px; padding:0 7px; border-radius:4px; border:1px solid var(--accent-2-border); background:var(--accent-2-subtle); color:var(--accent-2); cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
.reg b { font-weight:700; }
.reg span { color:var(--text-2); }
.reg em { font-style:normal; color:var(--text-3); font-size:10px; }
.reg:hover { filter:brightness(1.15); }
.reg.follow { box-shadow:0 0 0 2px var(--accent-2); }

/* bank map popover */
.pop { position:absolute; z-index:20; left:calc(9ch + 24px); top:100%; margin-top:-6px; width:min(820px, calc(100vw - 40px)); max-height:min(72vh, 640px); display:flex; flex-direction:column; background:var(--overlay); border:1px solid var(--border-strong); border-radius:8px; box-shadow:0 12px 36px rgba(0,0,0,.45); }
.pop[hidden] { display:none; }
.pophead { display:flex; align-items:center; gap:10px; padding:8px 10px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
.pophead .title { font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--text-3); }
.pophead .field input { width:24ch; }
.legend { display:flex; gap:10px; font-size:10.5px; color:var(--text-3); align-items:center; flex-wrap:wrap; }
.legend i { display:inline-block; width:12px; height:10px; border-radius:2px; margin-right:4px; vertical-align:-1px; border:1px solid var(--border); }
.legend .rl { display:inline-block; width:12px; height:3px; margin-right:4px; vertical-align:2px; border-radius:2px; }
.popbody { overflow:auto; padding:6px 10px 12px; }
.msec { margin-top:8px; }
.msec h4 { margin:0 0 4px; font-size:11px; font-weight:600; color:var(--text-2); display:flex; gap:8px; align-items:baseline; }
.msec h4 span { font-weight:400; color:var(--text-3); font-size:10.5px; }
.mgrid { display:grid; gap:2px; align-items:center; }
.mgrid .rh, .mgrid .ch { font-family:var(--mono); font-size:9.5px; color:var(--text-3); text-align:center; }
.mgrid .rh { text-align:right; padding-right:4px; }
.cell { position:relative; height:22px; border-radius:3px; border:1px solid transparent; font-family:var(--mono); font-size:10.5px; color:var(--text-2); cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; background:var(--k-ram); min-width:0; }
.cell.k-rom { background:repeating-linear-gradient(135deg, transparent 0 4px, color-mix(in srgb, var(--text-3) 12%, transparent) 4px 5px), var(--k-rom); }
.cell.k-card, .cell.k-flash { background:var(--k-card); }
.cell.k-div, .cell.k-divrom { background:var(--k-div); }
.cell.k-empty { background:transparent; border:1px dashed var(--border); color:var(--text-dis); }
.cell.k-mirror { background:transparent; border:1px solid var(--border-subtle); color:var(--text-dis); }
.cell:hover { border-color:var(--accent); color:var(--text); z-index:1; }
.cell.paged { color:var(--text); font-weight:700; box-shadow:inset 0 0 0 1px var(--accent-2); }
.cell.paged .pg { position:absolute; top:-5px; right:-4px; font-size:8.5px; line-height:11px; min-width:11px; padding:0 2px; border-radius:6px; background:var(--accent-2); color:var(--on-accent); font-family:var(--sans); font-weight:700; }
.cell.viewing { background:var(--accent); color:var(--on-accent); }
.cell .rb { position:absolute; left:2px; right:2px; bottom:1px; height:3px; border-radius:2px; }
.cell .cd { position:absolute; left:2px; top:2px; width:5px; height:5px; border-radius:50%; background:var(--changed); }
.cell.dim { opacity:.18; }
.cell.kbd { outline:2px solid var(--accent); outline-offset:1px; }
.chiprow { display:flex; gap:3px; flex-wrap:wrap; }
.chiprow .cell { width:5.5ch; }
.pophint { font-size:11px; color:var(--text-3); padding:6px 10px; border-top:1px solid var(--border); display:flex; gap:12px; flex-wrap:wrap; }
.pophint kbd { font-family:var(--mono); font-size:10px; border:1px solid var(--border-strong); border-bottom-width:2px; border-radius:3px; padding:0 4px; color:var(--text-2); }
.r-ula { background:var(--info); } .r-shadow { background:repeating-linear-gradient(90deg, var(--info) 0 3px, transparent 3px 5px); }
.r-l2 { background:var(--warn); } .r-l2s { background:repeating-linear-gradient(90deg, var(--warn) 0 3px, transparent 3px 5px); }
.r-tile { background:var(--success); } .r-stack { background:var(--accent-2); }
.r-sys { background:var(--text-3); } .r-app { background:var(--success); }

/* inspector */
.insp { border-left:1px solid var(--border); background:var(--panel); overflow:auto; min-height:0; font-size:12.5px; }
.ih { padding:10px 14px; border-bottom:1px solid var(--border); background:var(--chrome); display:flex; align-items:baseline; gap:10px; position:sticky; top:0; z-index:2; }
.ih .big { font-family:var(--mono); font-size:18px; font-weight:700; color:var(--accent); }
.ih .sub { font-family:var(--mono); color:var(--text-3); font-size:12px; }
.ih .badge { margin-left:auto; font-size:10.5px; padding:1px 7px; border-radius:4px; white-space:nowrap; }
.badge.ram { background:var(--accent-subtle); color:var(--accent); }
.badge.romb { background:var(--warn-subtle); color:var(--warn); }
.sec { padding:10px 14px 12px; border-bottom:1px solid var(--border-subtle); }
.sec h3 { margin:0 0 7px; font-size:10.5px; color:var(--text-3); text-transform:uppercase; letter-spacing:.7px; font-weight:600; display:flex; align-items:center; gap:8px; }
.sec h3 .r { margin-left:auto; text-transform:none; letter-spacing:0; font-weight:400; }
.kv { display:grid; grid-template-columns:11ch 1fr; gap:3px 10px; font-family:var(--mono); font-size:12px; }
.kv .k { color:var(--text-3); font-family:var(--sans); font-size:11.5px; }
.kv .v { color:var(--accent); overflow-wrap:anywhere; }
.kv .v.alt { color:var(--accent-2); }
.kv .v.plain { color:var(--text); }
.kv .v.note { color:var(--text-2); font-family:var(--sans); font-size:11.5px; }
.lchip { font-family:var(--mono); font-size:11px; padding:0 6px; border-radius:4px; background:color-mix(in srgb, var(--success) 15%, transparent); color:var(--success); }
.syn { font-family:var(--sans); font-size:11.5px; color:var(--text-2); margin-top:4px; }
.dis { font-family:var(--mono); font-size:12px; display:grid; grid-template-columns:6ch 11ch 1fr; gap:2px 8px; }
.dis .da { color:var(--accent); }
.dis .db { color:var(--text-3); }
.dis .dm { color:var(--text); white-space:nowrap; }
.dis .dm b { color:var(--accent-2); font-weight:600; }
.dis .cur { background:var(--accent-subtle); }
.dis .lbline { grid-column:1 / -1; color:var(--success); }
.editRow { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
.editRow input.v { width:16ch; height:24px; border:1px solid var(--border-strong); border-radius:5px; background:var(--canvas); font-family:var(--mono); font-size:12px; padding:0 6px; outline:none; }
.editRow input.v:focus { border-color:var(--accent); }
.hint { font-size:11.5px; color:var(--text-3); margin-top:6px; }
.hint kbd { font-family:var(--mono); font-size:10.5px; border:1px solid var(--border-strong); border-bottom-width:2px; border-radius:3px; padding:0 4px; color:var(--text-2); }
.warnline { font-size:11.5px; color:var(--warn); margin-top:6px; }
.actions { display:flex; gap:6px; flex-wrap:wrap; }
.heatbar { display:flex; gap:10px; font-family:var(--mono); font-size:11.5px; }
.heatbar span b { font-weight:700; }

.toast { position:fixed; bottom:34px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0; background:var(--raised); border:1px solid var(--border-strong); border-radius:8px; padding:8px 14px; font-size:12px; transition:all .2s; pointer-events:none; box-shadow:0 8px 24px rgba(0,0,0,.35); z-index:30; }
.toast.on { opacity:1; transform:translateX(-50%); }
.mockflag { position:fixed; right:12px; bottom:28px; font-size:10px; letter-spacing:.8px; color:var(--text-3); border:1px dashed var(--border-strong); padding:3px 7px; border-radius:4px; background:var(--canvas); z-index:5; }


/* In a single-partition bar the viewport is a strip along the bottom, so it never covers the partition name */
.viewport.thin { top:auto; bottom:-4px; height:5px; border-width:0; background:var(--accent); border-radius:3px; }

/* body */
.body { display:grid; grid-template-columns:minmax(0,1fr) 42ch; min-height:0; }
.dumpPane { display:flex; flex-direction:column; min-width:0; min-height:0; font-family:var(--mono); font-size:13px; }
.head, .row { display:grid; align-items:center; column-gap:1ch; padding:0 12px 0 0; white-space:pre; }
.head { height:24px; color:var(--text-3); font-size:11px; border-bottom:1px solid var(--border); background:var(--canvas); }
.scroller { overflow:auto; position:relative; flex:1; min-height:0; outline:none; }
.scroller:focus-visible { box-shadow:inset 0 0 0 1px var(--accent-border); }
.spacerBox { position:relative; }
.row { position:absolute; left:0; right:0; height:var(--row); }
.row.even { background:var(--even); }
.row:hover { background:var(--hover); }
.row.boundary { box-shadow:inset 0 1px 0 var(--border-strong); }
.gutter { display:flex; gap:3px; justify-content:flex-end; padding-right:4px; overflow:hidden; height:100%; align-items:center; }
.lab { font-size:11px; color:var(--success); overflow:hidden; text-overflow:ellipsis; min-width:0; }
.rtag { font-size:9.5px; font-weight:700; padding:0 4px; border-radius:3px; background:var(--accent-2-subtle); color:var(--accent-2); line-height:15px; flex:0 0 auto; }
.bank { color:var(--text-3); overflow:hidden; }
.addr { color:var(--accent); }
.bytes { display:flex; }
.b { position:relative; text-align:center; cursor:default; border-radius:3px; z-index:0; }
.b.zero { color:var(--text-3); }
.b.none { color:var(--text-dis); }
.b.hot::before { content:""; position:absolute; inset:1px -2px; border-radius:3px; z-index:-1; }
.b.hx::before { background:color-mix(in srgb, var(--heat-exec) var(--h), transparent); }
.b.hr::before { background:color-mix(in srgb, var(--heat-read) var(--h), transparent); }
.b.hw::before { background:color-mix(in srgb, var(--heat-write) var(--h), transparent); }
.b.ptr { box-shadow:inset 0 -2px 0 var(--accent-2); color:var(--accent-2); font-weight:700; }
.b.chg::after { content:""; position:absolute; right:-2px; top:2px; width:5px; height:5px; border-radius:50%; background:var(--changed); }
.b.found { background:var(--warn-subtle); outline:1px solid var(--warn); }
.b.inSel { background:var(--accent-subtle); color:var(--text); }
.b.cursor { outline:2px solid var(--accent); outline-offset:-1px; background:var(--accent-subtle); }
.b.hov { background:var(--accent-2-subtle); }
.b.editing { background:var(--accent); color:var(--on-accent); }
.b.flash { animation:flash 1.6s ease-out 2; }
@keyframes flash { 0%,100% { background:transparent; } 30% { background:var(--warn-subtle); outline:1px solid var(--warn); } }
.chars { color:var(--accent); display:flex; padding-left:8px; }
.c { width:1ch; text-align:center; }
.c.dot { color:var(--text-dis); }
.c.inSel, .c.cursor { background:var(--accent-subtle); }
.c.cursor { outline:1px solid var(--accent); }
.c.hov { background:var(--accent-2-subtle); color:var(--text); }
.c.found { background:var(--warn-subtle); }
.rom .b { color:color-mix(in srgb, var(--text) 82%, var(--text-3)); }

@media (max-width: 1050px) {
  .body { grid-template-columns:minmax(0,1fr); grid-template-rows:minmax(0,1fr) minmax(0,42%); }

<body>
<div class="ide">
  <div class="tabs">
    <div class="tab">main.kz80.asm</div>
    <div class="tab on"><span class="dot"></span>Machine Memory</div>
    <div class="tab">Disassembly</div>
    <div class="mock">MOCKUP:
      <select class="sel" id="machineSel" title="Mockup only: the machine to show">
        <option value="sp128">ZX Spectrum 128K</option>
        <option value="z88">Cambridge Z88</option>
        <option value="next">ZX Spectrum Next (2 MB)</option>
        <option value="nextks3">ZX Spectrum Next KS3 (4 MB)</option>
      </select>
      <button class="btn" id="stepBtn" title="Mockup only: simulate a debugger step">Simulate step</button>
      <div class="seg" id="themeSeg"><button data-v="dark" class="on">Dark</button><button data-v="light">Light</button></div>
    </div>
  </div>

  <div class="doc">
    <div class="toolbar" id="toolbar">
      <label class="field" title="An address ($8000, 32768, %1000…), a label, a register, or a partition-qualified address (47:$0100)"><span class="k">Go to</span><input id="goto" placeholder="$8000, label, 47:$100" autocomplete="off"></label>
      <label class="field find" title="Find bytes (21 00 58), text (&quot;HELLO&quot;) or a label"><span class="k">Find</span><input id="find" placeholder='21 00 58 or "text"' autocomplete="off"><span class="cnt" id="findCnt"></span><button class="nav" id="findPrev" title="Previous (Shift+F3)">▲</button><button class="nav" id="findNext" title="Next (F3)">▼</button></label>
      <div class="vsep"></div>
      <span class="lbl">Bytes</span>
      <div class="seg" id="widthSeg"><button data-v="8">8</button><button data-v="16" class="on">16</button><button data-v="32">32</button></div>
      <div class="seg" id="radixSeg"><button data-v="hex" class="on">Hex</button><button data-v="dec">Dec</button></div>
      <label class="check"><input type="checkbox" id="chars" checked> Chars</label>
      <label class="check"><input type="checkbox" id="labels" checked> Labels</label>
      <div class="vsep"></div>
      <span class="lbl">Heat</span>
      <div class="seg" id="heatSeg"><button data-v="off" class="on">Off</button><button data-v="exec">Exec</button><button data-v="read">Read</button><button data-v="write">Write</button><button data-v="all">All</button></div>
      <span class="spacer"></span>
      <span class="lbl">Follow</span>
      <select class="sel" id="follow"></select>
    </div>

    <div class="mapbar" id="mapbar">
      <span class="lbl" id="viewLbl">64K view</span>
      <div class="slots" id="slots"></div>
      <span class="lbl">Partitions</span>
      <div class="parts" id="parts"></div>
      <span class="lbl">Registers</span>
      <div class="regs" id="regs"></div>
      <div class="pop" id="pop" hidden>
        <div class="pophead">
          <span class="title" id="popTitle">Bank map</span>
          <label class="field"><span class="k">Filter</span><input id="popFilter" placeholder="47, M3, screen, slot 2, rom…" autocomplete="off"></label>
          <span class="spacer"></span>
          <div class="legend" id="popLegend"></div>
        </div>
        <div class="popbody" id="popBody"></div>
        <div class="pophint"><span><kbd>←↑→↓</kbd> move</span><span><kbd>Enter</kbd> show the partition</span><span><kbd>Esc</kbd> close</span><span>Type to filter: a name, a role, a group</span><span class="spacer"></span><span id="popCount"></span></div>
      </div>
    </div>

    <div class="body">
      <div class="dumpPane">
        <div class="head" id="head"></div>
        <div class="scroller" id="scroller" tabindex="0"><div class="spacerBox" id="spacerBox"></div></div>
      </div>
      <aside class="insp" id="insp"></aside>
    </div>
  </div>

  <div class="status">
    <span id="stMachine"></span><span id="stPaging"></span><span class="spacer"></span><span id="stSel"></span>
  </div>
</div>

const SYSVARS = {};
/* Shared by the Memory and Disassembly view mockups: the machine model. Inlined by each build. */
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const h2 = (n) => n.toString(16).toUpperCase().padStart(2, "0");
const h4 = (n) => n.toString(16).toUpperCase().padStart(4, "0");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let seed = 0x1234;
const rnd = () => ((seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff);

/* =====================================================================================
 * Machines. A machine is its partitions (id, name, group, kind, size, roles), the regions
 * of the 64K the CPU sees (which partition, at which offset), its registers and the user's
 * labels. Everything else in the view is generic over this.
 * ===================================================================================== */
const ROLE_NAMES = { ula: "ULA screen", shadow: "Shadow screen", l2: "Layer 2", l2s: "Layer 2 shadow", tile: "Tilemap", stack: "Stack", sys: "OZ system", app: "Application" };
const KIND_NAMES = { rom: "ROM", ram: "RAM", card: "RAM card", flash: "Flash card", div: "DivMMC RAM", divrom: "DivMMC ROM", empty: "Empty slot", mirror: "Mirror" };

function program(at) {
  // ld hl,$5800 / ld b,32 / loop: ld a,b / and 7 / ld (hl),a / inc hl / djnz loop / ld de,msg / call print / jr $ / print: ...
  return [0x21, 0x00, 0x58, 0x06, 0x20, 0x78, 0xe6, 0x07, 0x77, 0x23, 0x10, 0xf9, 0x11, (at + 0x20) & 0xff, (at + 0x20) >> 8,
    0xcd, (at + 0x18) & 0xff, (at + 0x18) >> 8, 0x18, 0xfe, 0, 0, 0, 0, 0x1a, 0xb7, 0xc8, 0xd7, 0x13, 0x18, 0xf9, 0];
}
const userLabelsAt = (at) => ({ [at]: "main", [at + 5]: "loop", [at + 0x12]: "halt", [at + 0x18]: "print", [at + 0x20]: "message", [at + 0x40]: "table" });
/** The user's data regions, as the annotations would mark them: padding, the message, the table */
const userRegionsAt = (at) => [
  { start: at + 0x14, end: at + 0x17, type: "bytes" },
  { start: at + 0x1f, end: at + 0x1f, type: "bytes" },
  { start: at + 0x20, end: at + 0x31, type: "text" },
  { start: at + 0x40, end: at + 0x4f, type: "words" }
];

function screenFill(buf, base) {
  for (let y = 0; y < 192; y++) for (let x = 0; x < 32; x++) {
    const a = ((y & 0xc0) << 5) | ((y & 7) << 8) | ((y & 0x38) << 2) | x;
    if (a - base >= 0 && a - base < buf.length) buf[a - base] = (y >> 3) % 4 === 0 ? 0 : ((x + (y >> 3)) % 3 === 0 ? 0xaa : (y & 1 ? 0x0f : 0xf0));
  }
}

function buildSp128() {
  const parts = [
    { id: "R0", name: "ROM 0", group: "ROM", kind: "rom", size: 0x4000, rom: "sp128/R0" },
    { id: "R1", name: "ROM 1", group: "ROM", kind: "rom", size: 0x4000, rom: "sp128/R1" },
    ...Array.from({ length: 8 }, (_, i) => ({ id: "B" + i, name: "Bank " + i, group: "RAM", kind: "ram", size: 0x4000, roles: i === 5 ? ["ula"] : i === 7 ? ["shadow"] : [] }))
  ];
  return {
    id: "sp128", title: "ZX Spectrum 128K", unit: "16K bank", slotName: (i) => `Slot ${i}`,
    parts, regions: [["R1", 0], ["B5", 0], ["B2", 0], ["B0", 0]].map(([p, o], i) => ({ start: i * 0x4000, len: 0x4000, part: p, off: o, cap: `SLOT ${i}` })),
    regs: { PC: 0x8008, SP: 0xff3c, HL: 0x5812, DE: 0x8020, BC: 0x0e00, AF: 0x0701, IX: 0x5c3a, IY: 0x5c3a },
    userLabels: { ...userLabelsAt(0x8000), 0xff3c: "stack_top" },
    userRegions: userRegionsAt(0x8000), sysvars: typeof SYSVARS !== "undefined" ? SYSVARS : {},
    setup(m) {
      const s5 = m.store("B5"); screenFill(s5, 0); for (let i = 0; i < 768; i++) s5[0x1800 + i] = 0x38; for (let i = 0; i < 18; i++) s5[0x1800 + i] = (i & 7) | 0x40;
      m.store("B2").set(program(0x8000)); [..."HELLO FROM KLIVE!"].forEach((c, i) => (m.store("B2")[0x20 + i] = c.charCodeAt(0)));
      m.store("B0").set([0x12, 0x80, 0x76, 0x1b, 0x03, 0x13, 0x00, 0x3e], 0x3f3c);
      m.changed = new Set([...Array.from({ length: 18 }, (_, i) => "B5:" + (0x1800 + i)), "B0:" + 0x3f3c, "B0:" + 0x3f3d]);
      for (let o = 0; o < 0x20; o++) m.addHeat("B2", o, 0, o >= 5 && o < 12 ? 32 : 3);
      for (let o = 0x10; o < 0x18; o++) m.addHeat("R1", o, 0, 17);
      for (let o = 0x1800; o < 0x1820; o++) m.addHeat("B5", o, 2, 1);
    }
  };
}

function buildZ88() {
  // --- Slot 0: OZ 4.7 ROM (512K, $00-$1F) and 512K internal RAM ($20-$3F)
  // --- Slot 1: a 128K RAM card ($40-$47, mirrored through $7F); slot 2: a 1 MB flash card; slot 3: empty
  const parts = [];
  for (let b = 0; b < 256; b++) {
    const id = h2(b), slot = b >> 6;
    let p = { id, name: `Bank $${id}`, size: 0x4000, slot, group: `Slot ${slot}` };
    if (b < 0x20) Object.assign(p, { kind: "rom", note: "OZ 4.7 ROM", rom: b === 0 ? "z88/00" : b === 0x1f ? "z88/1F" : undefined });
    else if (b < 0x40) Object.assign(p, { kind: "ram", note: "Internal RAM (512K)" });
    else if (b < 0x48) Object.assign(p, { kind: "card", note: "RAM card, 128K" });
    else if (b < 0x80) Object.assign(p, { kind: "mirror", mirrorOf: h2(0x40 + (b & 7)), note: `Mirror of $${h2(0x40 + (b & 7))}: the 128K card repeats through the slot` });
    else if (b < 0xc0) Object.assign(p, { kind: "flash", note: "Flash card, 1 MB (Intel 28F008)" });
    else Object.assign(p, { kind: "empty", note: "Slot 3 is empty" });
    p.roles = b === 0x20 ? ["sys"] : b === 0x21 ? ["app"] : b === 0x1f ? ["sys"] : [];
    parts.push(p);
  }
  const SR = { SR0: 0x20, SR1: 0x21, SR2: 0x40, SR3: 0x1f };
  return {
    id: "z88", title: "Cambridge Z88", unit: "16K bank", slotName: (i) => (i === 0 ? "Segment 0" : `Segment ${i}`),
    slotTitles: ["Slot 0 · OZ ROM 512K + internal RAM 512K", "Slot 1 · RAM card 128K", "Slot 2 · Flash card 1 MB", "Slot 3 · empty"],
    parts,
    regions: [
      { start: 0x0000, len: 0x2000, part: "00", off: 0x0000, cap: "SEG 0 · LOW" },
      { start: 0x2000, len: 0x2000, part: h2(SR.SR0), off: 0x2000, cap: "SEG 0 · SR0" },
      { start: 0x4000, len: 0x4000, part: h2(SR.SR1), off: 0, cap: "SEG 1 · SR1" },
      { start: 0x8000, len: 0x4000, part: h2(SR.SR2), off: 0, cap: "SEG 2 · SR2" },
      { start: 0xc000, len: 0x4000, part: h2(SR.SR3), off: 0, cap: "SEG 3 · SR3" }
    ],
    regs: { PC: 0x4008, SP: 0x3ff0, HL: 0x4040, DE: 0x4020, BC: 0x0e00, AF: 0x2044, IX: 0x2a00, IY: 0x3800 },
    userLabels: { ...userLabelsAt(0x4000), 0x3ff0: "stack_top" },
    userRegions: userRegionsAt(0x4000), sysvars: {},
    setup(m) {
      m.store("21").set(program(0x4000)); [..."HELLO FROM KLIVE!"].forEach((c, i) => (m.store("21")[0x20 + i] = c.charCodeAt(0)));
      const card = m.store("40"); for (let i = 0; i < 0x400; i++) card[i] = Math.floor(rnd() * 256);
      const fl = m.store("80"); fl.fill(0xff); [..."oz"].forEach((c, i) => (fl[0x3ffe + i] = c.charCodeAt(0)));
      m.changed = new Set([...Array.from({ length: 8 }, (_, i) => "20:" + (0x3ff0 + i)), "40:16", "40:17"]);
      for (let o = 0; o < 0x20; o++) m.addHeat("21", o, 0, o >= 5 && o < 12 ? 32 : 3);
      for (let o = 0; o < 0x40; o++) m.addHeat("1F", 0x100 + o, 0, 9);
      for (let o = 0x3fe0; o < 0x4000; o++) m.addHeat("20", o, 2, 4);
    }
  };
}

function buildNext(ks3) {
  const parts = [];
  ["R0", "R1", "R2", "R3"].forEach((id, i) => parts.push({ id, name: `Next ROM ${i}`, group: "Next ROM", kind: "rom", size: 0x4000, rom: i === 0 ? "next/R0" : undefined }));

        <div class="seg" id="sizeSeg"><button data-v="1" class="on">1</button><button data-v="2">2</button><button data-v="4">4</button></div>
        <label class="check"><input type="checkbox" id="bigEnd"> BE</label>
        <button class="btn primary" id="setBtn" ${ro ? "disabled" : ""}>Set</button></div>
      ${ro ? `<div class="warnline">${esc(why)}</div>` : `<div class="hint">Values: <code>$FF</code>, <code>255</code>, <code>%1111</code>, a label, or <code>"text"</code>.</div>`}
    </div>
    ${selSec}
    ${dis ? `<div class="sec"><h3>Instructions here<span class="r"><button class="btn" data-act="disass" style="height:20px">Open in Disassembly ↗</button></span></h3><div class="dis">${dis}</div></div>` : ""}
    ${h ? `<div class="sec"><h3>Heat</h3><div class="heatbar"><span style="color:var(--heat-exec)">E <b>${h[0]}</b></span><span style="color:var(--heat-read)">R <b>${h[1]}</b></span><span style="color:var(--heat-write)">W <b>${h[2]}</b></span></div></div>` : ""}
    <div class="sec"><h3>Use</h3><div class="actions"><button class="btn" data-act="bpExec">Breakpoint here</button><button class="btn" data-act="bpWrite">Break on write</button><button class="btn" data-act="watch">Watch as word</button><button class="btn" data-act="gfx">Show as graphics</button></div>
      <div class="hint">Breakpoints here use the partition-qualified address <code>${part}:$${h4(off)}</code>, so they stop only when this ${M.unit} is the one paged in.</div></div>
    <div class="sec"><h3>Keys</h3><div class="hint" style="margin:0;line-height:1.9"><kbd>←↑→↓</kbd> move · <kbd>Shift</kbd>+move select · <kbd>PgUp</kbd>/<kbd>PgDn</kbd> page · <kbd>Ctrl</kbd>+<kbd>G</kbd> go to · <kbd>Ctrl</kbd>+<kbd>F</kbd> find · <kbd>F3</kbd> next · <kbd>Ctrl</kbd>+<kbd>B</kbd> bank map · <kbd>0-9 A-F</kbd> overwrite</div></div>`;
  const sizeSeg = el.querySelector("#sizeSeg");
  sizeSeg?.addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; sizeSeg.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b)); });
  document.getElementById("stSel").innerHTML = sel && sel[1] > sel[0] ? `Selection <b>$${h4(sel[0])}–$${h4(sel[1])}</b> (${sel[1] - sel[0] + 1} bytes)` : `Cursor <b>${part}:$${h4(off)}</b>${cpu !== undefined ? ` = <b>$${h4(cpu)}</b>` : ""}`;
}

function render() { renderHead(); renderRows(); renderMap(); renderInsp(); }

/* ---------------------------------------------------------------- interaction */
function toast(m) { const t = document.getElementById("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("on"), 2000); }
function reveal(a, center) {
  const top = Math.floor(a / ui.width) * ROW_H;
  if (center || top < scroller.scrollTop || top + ROW_H > scroller.scrollTop + scroller.clientHeight) scroller.scrollTop = top - (center ? scroller.clientHeight / 3 : 0);
}
function moveCursor(a, extend, center) {
  a = Math.max(0, Math.min(viewSize() - 1, a));
  if (extend) { if (ui.anchor === null) ui.anchor = ui.cursor; } else ui.anchor = null;
  ui.cursor = a; ui.edit = null; reveal(a, center); renderRows(); renderInsp(); updateViewport();
}
function goTo(a, flash = true) { ui.flash = flash ? a : null; moveCursor(a, false, true); setTimeout(() => { ui.flash = null; renderRows(); }, 3400); }
function parseNum(s) {
  if (/^(\$|0x|#)[0-9a-f]+$/i.test(s)) return parseInt(s.replace(/^(\$|0x|#)/i, ""), 16);
  if (/^%[01]+$/.test(s)) return parseInt(s.slice(1), 2);
  if (/^[0-9]+$/.test(s)) return ui.radix === "dec" ? parseInt(s, 10) : parseInt(s, 16);
  if (/^[0-9a-f]+$/i.test(s)) return parseInt(s, 16);
  return null;
}
/** Go-to target: { part?, addr } — a number, a label, a register, or `PART:offset` */
function parseTarget(s) {
  s = s.trim(); if (!s) return null;
  const q = /^([A-Za-z0-9]{1,3}):(.+)$/.exec(s);
  if (q && M.byId.has(q[1].toUpperCase())) { const n = parseNum(q[2]); return n === null ? null : { part: q[1].toUpperCase(), addr: n }; }
  if (M.regs[s.toUpperCase()] !== undefined) return { addr: M.regs[s.toUpperCase()] };
  const lab = allLabels().find((l) => l.name.toLowerCase() === s.toLowerCase());
  if (lab) return lab.cpu !== undefined ? { addr: lab.cpu } : { part: lab.part, addr: lab.off };
  const n = parseNum(s); return n === null ? null : { addr: n };
}
function goToTarget(t) {
  const size = t.part ? M.byId.get(t.part).size : 0x10000;
  if (t.addr >= size) { toast("Past the end of " + (t.part ?? "the 64K")); return; }
  // --- The cursor moves before the view changes, so nothing renders a cursor the new view lacks
  ui.cursor = t.addr; ui.anchor = null;
  if (t.part) { if (view.mode !== "part" || view.part !== t.part) { view.mode = "part"; view.part = t.part; ui.recent = [t.part, ...ui.recent.filter((x) => x !== t.part)].slice(0, 8); render(); } }
  else if (view.mode !== "64k") { view.mode = "64k"; render(); }
  goTo(t.addr);
}
function runFind(s) {
  ui.found = []; ui.foundIdx = -1; ui.foundLen = 0;
  s = s.trim(); let pat = null;
  if (!s) { document.getElementById("findCnt").textContent = ""; renderRows(); return; }
  const m = /^"(.*)"?$/.exec(s);
  if (m) pat = [...m[1].replace(/"$/, "")].map((c) => c.charCodeAt(0));
  else if (/^([0-9a-f]{2}\s*)+$/i.test(s)) pat = s.replace(/\s+/g, "").match(/../g).map((x) => parseInt(x, 16));
  if (pat && pat.length) {
    const end = viewSize() - pat.length;
    for (let a = 0; a <= end && ui.found.length < 500; a++) { let ok = true; for (let i = 0; i < pat.length; i++) if (readAt(a + i) !== pat[i]) { ok = false; break; } if (ok) ui.found.push(a); }
    ui.foundLen = pat.length;
  }
  document.getElementById("findCnt").textContent = ui.found.length ? `0 / ${ui.found.length}` : "none";
  stepFind(1);
}
function stepFind(d) {
  if (!ui.found.length) { renderRows(); return; }
  ui.foundIdx = (ui.foundIdx + d + ui.found.length) % ui.found.length;
  document.getElementById("findCnt").textContent = `${ui.foundIdx + 1} / ${ui.found.length}`;
  ui.anchor = null; moveCursor(ui.found[ui.foundIdx], false, true);
}

scroller.addEventListener("scroll", () => { renderRows(); updateViewport(); });
window.addEventListener("resize", () => { renderRows(); updateViewport(); });
let dragging = false;
spacerBox.addEventListener("mousedown", (e) => {
  const t = e.target.closest("[data-a]"); if (!t) return; scroller.focus();
  dragging = true; const a = +t.dataset.a;
  if (e.shiftKey) { if (ui.anchor === null) ui.anchor = ui.cursor; ui.cursor = a; } else { ui.anchor = a; ui.cursor = a; }
  ui.edit = null; renderRows(); renderInsp(); e.preventDefault();
});
spacerBox.addEventListener("mousemove", (e) => {
  const t = e.target.closest("[data-a]"); const a = t ? +t.dataset.a : null;
  if (dragging && a !== null && a !== ui.cursor) { ui.cursor = a; renderRows(); renderInsp(); return; }
  if (a !== ui.hover) { ui.hover = a; renderRows(); }
});
spacerBox.addEventListener("mouseleave", () => { ui.hover = null; renderRows(); });
window.addEventListener("mouseup", () => { if (dragging) { dragging = false; if (ui.anchor === ui.cursor) ui.anchor = null; renderInsp(); } });
spacerBox.addEventListener("dblclick", (e) => { const t = e.target.closest("[data-a]"); if (!t) return; const a = +t.dataset.a; if (isReadOnly(a)) { toast(`${locate(a)[0]} cannot be written here`); return; } ui.cursor = a; ui.anchor = null; ui.edit = { addr: a, text: "" }; renderRows(); });

scroller.addEventListener("keydown", (e) => {
  const a = ui.cursor, W = ui.width, page = Math.floor(scroller.clientHeight / ROW_H) * W;
  const map = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -W, ArrowDown: W, PageUp: -page, PageDown: page };
  if (map[e.key] !== undefined) { e.preventDefault(); if (ui.edit) commitEdit(); moveCursor(a + map[e.key], e.shiftKey); return; }
  if (e.key === "Home") { e.preventDefault(); moveCursor(e.ctrlKey || e.metaKey ? 0 : a - (a % W), e.shiftKey); return; }
  if (e.key === "End") { e.preventDefault(); moveCursor(e.ctrlKey || e.metaKey ? viewSize() - 1 : a - (a % W) + W - 1, e.shiftKey); return; }
  if (e.key === "Escape") { ui.edit = null; ui.anchor = null; renderRows(); renderInsp(); return; }
  const digit = ui.radix === "hex" ? /^[0-9a-f]$/i : /^[0-9]$/;
  if (digit.test(e.key) && !e.ctrlKey && !e.metaKey) {
    e.preventDefault();
    if (isReadOnly(a)) { toast(`${locate(a)[0]} cannot be written here`); return; }
    if (!ui.edit) ui.edit = { addr: a, text: "" };
    ui.edit.text += e.key.toUpperCase();
    if (ui.edit.text.length >= (ui.radix === "hex" ? 2 : 3)) { commitEdit(); moveCursor(a + 1, false); return; }
    renderRows(); return;
  }
  if (e.key === "Enter" && ui.edit) { commitEdit(); moveCursor(a + 1, false); }
});
function commitEdit() {
  if (!ui.edit || !ui.edit.text) { ui.edit = null; return; }
  const v = ui.radix === "hex" ? parseInt(ui.edit.text, 16) : Math.min(255, parseInt(ui.edit.text, 10));
  writeAt(ui.edit.addr, v & 0xff); ui.edit = null;
}
document.addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && k === "g") { e.preventDefault(); document.getElementById("goto").focus(); }
  if ((e.ctrlKey || e.metaKey) && k === "f") { e.preventDefault(); document.getElementById("find").focus(); }
  if ((e.ctrlKey || e.metaKey) && k === "b" && M.big) { e.preventDefault(); popOpen() ? closePop() : openPop(); }
  if (e.key === "F3") { e.preventDefault(); stepFind(e.shiftKey ? -1 : 1); }
});
document.getElementById("goto").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { const t = parseTarget(e.target.value); if (!t) { toast("Not an address, a label, a register or PART:offset"); return; } e.target.value = ""; goToTarget(t); scroller.focus(); }
  if (e.key === "Escape") { e.target.value = ""; scroller.focus(); }
});
document.getElementById("find").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { if (e.target.dataset.last === e.target.value) stepFind(e.shiftKey ? -1 : 1); else { e.target.dataset.last = e.target.value; runFind(e.target.value); } }
  if (e.key === "Escape") { e.target.value = ""; e.target.dataset.last = ""; runFind(""); scroller.focus(); }
});
document.getElementById("findNext").addEventListener("click", (e) => { e.preventDefault(); stepFind(1); });
document.getElementById("findPrev").addEventListener("click", (e) => { e.preventDefault(); stepFind(-1); });

function seg(id, key, after) {
  const el = document.getElementById(id);
  el.addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; ui[key] = b.dataset.v; el.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b)); after?.(b.dataset.v); });
}
seg("widthSeg", "width", (v) => { ui.width = +v; renderHead(); reveal(ui.cursor, true); renderRows(); updateViewport(); });
seg("radixSeg", "radix", () => render());
seg("heatSeg", "heat", () => { renderRows(); renderMap(); });
seg("themeSeg", "theme", (v) => (document.documentElement.dataset.theme = v));
document.getElementById("chars").addEventListener("change", (e) => { ui.chars = e.target.checked; renderHead(); renderRows(); });
document.getElementById("labels").addEventListener("change", (e) => { ui.labels = e.target.checked; renderHead(); renderRows(); });
document.getElementById("follow").addEventListener("change", (e) => { ui.follow = e.target.value; if (ui.follow) followNow(); renderMap(); });
function followNow() { if (view.mode !== "64k") { view.mode = "64k"; render(); } goTo(M.regs[ui.follow], false); }

document.getElementById("mapbar").addEventListener("click", (e) => {
  if (e.target.closest("#pop")) return;
  if (e.target.closest("#mapBtn")) { popOpen() ? closePop() : openPop(); return; }
  const s = e.target.closest("[data-slot]"); if (s) { if (view.mode !== "64k") { view.mode = "64k"; render(); } goTo(M.regions[+s.dataset.slot].start, false); return; }
  const p = e.target.closest("[data-part]"); if (p) { showPart(p.dataset.part); return; }
  const r = e.target.closest("[data-reg]"); if (r) { if (view.mode !== "64k") { view.mode = "64k"; render(); } goTo(M.regs[r.dataset.reg]); }
});

document.getElementById("insp").addEventListener("click", (e) => {
  const act = e.target.closest("[data-act]")?.dataset.act;
  if (e.target.id === "setBtn") {
    const raw = document.getElementById("editVal").value.trim();
    const size = +document.querySelector("#sizeSeg .on").dataset.v, be = document.getElementById("bigEnd").checked;
    let bytes; const t = /^"(.*)"$/.exec(raw);
    if (t) bytes = [...t[1]].map((c) => c.charCodeAt(0) & 0xff);
    else { const tg = parseTarget(raw.replace(/\s+/g, "")); if (!tg) { toast("Not a value"); return; } bytes = Array.from({ length: size }, (_, i) => (tg.addr >> (8 * i)) & 0xff); if (be) bytes.reverse(); }
    bytes.forEach((b, i) => writeAt(ui.cursor + i, b));
    toast(`Wrote ${bytes.length} byte${bytes.length > 1 ? "s" : ""}`); renderRows(); renderInsp(); return;
  }
  if (!act) return;
  const sel = selRange() ?? [ui.cursor, ui.cursor];
  const bytes = []; for (let i = sel[0]; i <= sel[1]; i++) bytes.push(readAt(i) ?? 0);
  const [part, off] = locate(sel[0]);
  const msgs = {
    copyHex: () => { navigator.clipboard?.writeText(bytes.map(h2).join(" ")).catch(() => {}); return "Copied as hex"; },
    copyDefb: () => { navigator.clipboard?.writeText(".defb " + bytes.map((b) => "$" + h2(b)).join(", ")).catch(() => {}); return "Copied as .defb"; },
    findSel: () => { const s = bytes.map(h2).join(" "); document.getElementById("find").value = s; runFind(s); return `Found ${ui.found.length}`; },
    gfx: () => `Mockup: the Graphics Finder would open at ${part}:$${h4(off)}`,
    disass: () => `Mockup: the Disassembly view would reveal ${part}:$${h4(off)}`,
    bpExec: () => `Mockup: bp-set ${part}:$${h4(off)}`,
    bpWrite: () => `Mockup: a memory-write breakpoint on ${part}:$${h4(off)}${sel[1] > sel[0] ? " for " + (sel[1] - sel[0] + 1) + " bytes" : ""}`,
    watch: () => `Mockup: a watch on the word at ${part}:$${h4(off)}`
  };
  toast(msgs[act]());
});

document.getElementById("stepBtn").addEventListener("click", () => {
  M.changed = new Set();
  const loopStart = M.userLabels ? +Object.entries(M.userLabels).find(([, n]) => n === "loop")[0] : 0;
  const d = decode(view.mode === "64k" ? M.regs.PC : 0);
  M.regs.HL = (M.regs.HL + 1) & 0xffff;
  const r = regionAt(M.regs.HL), hp = r.part, ho = r.off + M.regs.HL - r.start, s = M.store(hp);
  if (s) { s[ho] = (s[ho] + 9) & 0xff; M.changed.add(hp + ":" + ho); }
  M.regs.PC = M.regs.PC === loopStart + 5 ? loopStart : (M.regs.PC + d.len) & 0xffff;
  M.regs.BC = (M.regs.BC - 0x100) & 0xffff;
  const pr = regionAt(M.regs.PC); M.addHeat(pr.part, pr.off + M.regs.PC - pr.start, 0, 1);
  if (ui.follow) followNow(); else { renderRows(); renderMap(); renderInsp(); }
  if (popOpen()) renderPop();
  toast(`Stepped to $${h4(M.regs.PC)}: changed bytes are dotted`);
});

function loadMachine(id) {
  M = instantiate(MACHINES[id]());
  view.mode = "64k"; view.part = null; ui.recent = []; ui.anchor = null; ui.found = []; ui.follow = "";
  document.getElementById("findCnt").textContent = "";
  document.getElementById("follow").innerHTML = `<option value="">—</option>` + ptrRegs().map(([r]) => `<option>${r}</option>`).join("");
  // --- A few recently viewed partitions, as a session would have them
  if (M.big) ui.recent = id === "z88" ? ["41", "80", "C0"] : ["12", "0E", "M3"];
  ui.cursor = M.regs.PC; pop.hidden = true; popFilter.value = "";
  render();
  requestAnimationFrame(() => { reveal(ui.cursor, true); renderRows(); updateViewport(); scroller.focus(); });
}
document.getElementById("machineSel").addEventListener("change", (e) => loadMachine(e.target.value));

document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
document.querySelectorAll("#themeSeg button").forEach((b) => b.classList.toggle("on", b.dataset.v === document.documentElement.dataset.theme));
const startMachine = new URLSearchParams(location.search).get("machine") ?? "sp128";
document.getElementById("machineSel").value = MACHINES[startMachine] ? startMachine : "sp128";
loadMachine(document.getElementById("machineSel").value);
</script>
</body>
</html>
