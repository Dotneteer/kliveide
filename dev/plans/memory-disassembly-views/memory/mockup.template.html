<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory View Mockup</title>
<!--
  MOCKUP of a modernized "Machine Memory" document for Klive IDE. Self-contained: open it in a
  browser. Three machines, switched with the Machine menu at the top right (mockup only):
    - ZX Spectrum 128K: 10 partitions, listed in full.
    - Cambridge Z88: 256 banks in four card slots.
    - ZX Spectrum Next: 247 partitions (503 on a 4 MB KS3 board).
  Real: the ROM pages embedded by build-mockup.cjs (Spectrum ROM 0/1, OZ 4.7 banks $00/$1F, Next
  ROM R0) and their labels from Klive's own ROM sidecars. Simulated: RAM, cards, registers, paging,
  the user's labels, the heat map and the "changed since the previous stop" marks.
  Generated by dev/plans/memory-disassembly-views/memory/build-mockup.cjs from mockup.template.html.
-->
<style>
/*__SHARED_CSS__*/
/* body */
.body { display:grid; grid-template-columns:minmax(0,1fr) 42ch; min-height:0; }
.dumpPane { display:flex; flex-direction:column; min-width:0; min-height:0; font-family:var(--mono); font-size:13px; }
.head, .row { display:grid; align-items:center; column-gap:1ch; padding:0 12px 0 0; white-space:pre; }
.head { height:24px; color:var(--text-3); font-size:11px; border-bottom:1px solid var(--border); background:var(--canvas); }
.scroller { overflow:auto; position:relative; flex:1; min-height:0; outline:none; }
.scroller:focus-visible { box-shadow:inset 0 0 0 1px var(--accent-border); }
.spacerBox { position:relative; }
.row { position:absolute; left:0; right:0; height:var(--row); }
.row.even { background:var(--even); }
.row:hover { background:var(--hover); }
.row.boundary { box-shadow:inset 0 1px 0 var(--border-strong); }
.gutter { display:flex; gap:3px; justify-content:flex-end; padding-right:4px; overflow:hidden; height:100%; align-items:center; }
.lab { font-size:11px; color:var(--success); overflow:hidden; text-overflow:ellipsis; min-width:0; }
.rtag { font-size:9.5px; font-weight:700; padding:0 4px; border-radius:3px; background:var(--accent-2-subtle); color:var(--accent-2); line-height:15px; flex:0 0 auto; }
.bank { color:var(--text-3); overflow:hidden; }
.addr { color:var(--accent); }
.bytes { display:flex; }
.b { position:relative; text-align:center; cursor:default; border-radius:3px; z-index:0; }
.b.zero { color:var(--text-3); }
.b.none { color:var(--text-dis); }
.b.hot::before { content:""; position:absolute; inset:1px -2px; border-radius:3px; z-index:-1; }
.b.hx::before { background:color-mix(in srgb, var(--heat-exec) var(--h), transparent); }
.b.hr::before { background:color-mix(in srgb, var(--heat-read) var(--h), transparent); }
.b.hw::before { background:color-mix(in srgb, var(--heat-write) var(--h), transparent); }
.b.ptr { box-shadow:inset 0 -2px 0 var(--accent-2); color:var(--accent-2); font-weight:700; }
.b.chg::after { content:""; position:absolute; right:-2px; top:2px; width:5px; height:5px; border-radius:50%; background:var(--changed); }
.b.found { background:var(--warn-subtle); outline:1px solid var(--warn); }
.b.inSel { background:var(--accent-subtle); color:var(--text); }
.b.cursor { outline:2px solid var(--accent); outline-offset:-1px; background:var(--accent-subtle); }
.b.hov { background:var(--accent-2-subtle); }
.b.editing { background:var(--accent); color:var(--on-accent); }
.b.flash { animation:flash 1.6s ease-out 2; }
@keyframes flash { 0%,100% { background:transparent; } 30% { background:var(--warn-subtle); outline:1px solid var(--warn); } }
.chars { color:var(--accent); display:flex; padding-left:8px; }
.c { width:1ch; text-align:center; }
.c.dot { color:var(--text-dis); }
.c.inSel, .c.cursor { background:var(--accent-subtle); }
.c.cursor { outline:1px solid var(--accent); }
.c.hov { background:var(--accent-2-subtle); color:var(--text); }
.c.found { background:var(--warn-subtle); }
.rom .b { color:color-mix(in srgb, var(--text) 82%, var(--text-3)); }

@media (max-width: 1050px) {
  .body { grid-template-columns:minmax(0,1fr); grid-template-rows:minmax(0,1fr) minmax(0,42%); }
  .insp { border-left:none; border-top:1px solid var(--border); }
}
</style>
</head>
<body>
<div class="ide">
  <div class="tabs">
    <div class="tab">main.kz80.asm</div>
    <div class="tab on"><span class="dot"></span>Machine Memory</div>
    <div class="tab">Disassembly</div>
    <div class="mock">MOCKUP:
      <select class="sel" id="machineSel" title="Mockup only: the machine to show">
        <option value="sp128">ZX Spectrum 128K</option>
        <option value="z88">Cambridge Z88</option>
        <option value="next">ZX Spectrum Next (2 MB)</option>
        <option value="nextks3">ZX Spectrum Next KS3 (4 MB)</option>
      </select>
      <button class="btn" id="stepBtn" title="Mockup only: simulate a debugger step">Simulate step</button>
      <div class="seg" id="themeSeg"><button data-v="dark" class="on">Dark</button><button data-v="light">Light</button></div>
    </div>
  </div>

  <div class="doc">
    <div class="toolbar" id="toolbar">
      <label class="field" title="An address ($8000, 32768, %1000…), a label, a register, or a partition-qualified address (47:$0100)"><span class="k">Go to</span><input id="goto" placeholder="$8000, label, 47:$100" autocomplete="off"></label>
      <label class="field find" title="Find bytes (21 00 58), text (&quot;HELLO&quot;) or a label"><span class="k">Find</span><input id="find" placeholder='21 00 58 or "text"' autocomplete="off"><span class="cnt" id="findCnt"></span><button class="nav" id="findPrev" title="Previous (Shift+F3)">▲</button><button class="nav" id="findNext" title="Next (F3)">▼</button></label>
      <div class="vsep"></div>
      <span class="lbl">Bytes</span>
      <div class="seg" id="widthSeg"><button data-v="8">8</button><button data-v="16" class="on">16</button><button data-v="32">32</button></div>
      <div class="seg" id="radixSeg"><button data-v="hex" class="on">Hex</button><button data-v="dec">Dec</button></div>
      <label class="check"><input type="checkbox" id="chars" checked> Chars</label>
      <label class="check"><input type="checkbox" id="labels" checked> Labels</label>
      <div class="vsep"></div>
      <span class="lbl">Heat</span>
      <div class="seg" id="heatSeg"><button data-v="off" class="on">Off</button><button data-v="exec">Exec</button><button data-v="read">Read</button><button data-v="write">Write</button><button data-v="all">All</button></div>
      <span class="spacer"></span>
      <span class="lbl">Follow</span>
      <select class="sel" id="follow"></select>
    </div>

    <div class="mapbar" id="mapbar">
      <span class="lbl" id="viewLbl">64K view</span>
      <div class="slots" id="slots"></div>
      <span class="lbl">Partitions</span>
      <div class="parts" id="parts"></div>
      <span class="lbl">Registers</span>
      <div class="regs" id="regs"></div>
      <div class="pop" id="pop" hidden>
        <div class="pophead">
          <span class="title" id="popTitle">Bank map</span>
          <label class="field"><span class="k">Filter</span><input id="popFilter" placeholder="47, M3, screen, slot 2, rom…" autocomplete="off"></label>
          <span class="spacer"></span>
          <div class="legend" id="popLegend"></div>
        </div>
        <div class="popbody" id="popBody"></div>
        <div class="pophint"><span><kbd>←↑→↓</kbd> move</span><span><kbd>Enter</kbd> show the partition</span><span><kbd>Esc</kbd> close</span><span>Type to filter: a name, a role, a group</span><span class="spacer"></span><span id="popCount"></span></div>
      </div>
    </div>

    <div class="body">
      <div class="dumpPane">
        <div class="head" id="head"></div>
        <div class="scroller" id="scroller" tabindex="0"><div class="spacerBox" id="spacerBox"></div></div>
      </div>
      <aside class="insp" id="insp"></aside>
    </div>
  </div>

  <div class="status">
    <span id="stMachine"></span><span id="stPaging"></span><span class="spacer"></span><span id="stSel"></span>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="mockflag">MOCKUP · ROM pages and labels real, rest simulated</div>

<script>
const ROMS = __ROMS__;
const SYSVARS = {};
/*__SHARED_MACHINES__*/
/** The registers that hold addresses: AF does not */
const ptrRegs = () => Object.entries(M.regs).filter(([r]) => r !== "AF");

/* =====================================================================================
 * View state and addressing
 * ===================================================================================== */
const ui = { width: 16, radix: "hex", chars: true, labels: true, heat: "off", follow: "", cursor: 0x8008, anchor: null, hover: null,
  found: [], foundIdx: -1, foundLen: 0, edit: null, flash: null, recent: [] };
const view = { mode: "64k", part: null };
const ROW_H = 22;
const scroller = document.getElementById("scroller"), spacerBox = document.getElementById("spacerBox");

const regionAt = (a) => M.regions.find((r) => a >= r.start && a < r.start + r.len);
/** The partition and offset a view address shows */
function locate(a) {
  if (view.mode === "64k") { const r = regionAt(a); return [r.part, r.off + (a - r.start)]; }
  return [view.part, a];
}
const readAt = (a) => { const [p, o] = locate(a); const s = M.store(p); return s && o >= 0 && o < s.length ? s[o] : null; };
const writeAt = (a, v) => { const [p, o] = locate(a); const s = M.store(p); if (s) { s[o] = v; M.changed.add(p + ":" + o); } };
const viewSize = () => (view.mode === "64k" ? 0x10000 : M.byId.get(view.part).size);
/** Where the CPU sees a partition offset now, if anywhere */
const cpuAddrOf = (part, off) => { for (const r of M.regions) if (r.part === part && off >= r.off && off < r.off + r.len) return r.start + off - r.off; return undefined; };
const pagedSlots = (part) => M.regions.map((r, i) => (r.part === part ? i : -1)).filter((i) => i >= 0);
const partKind = (part) => M.byId.get(part)?.kind;
const isReadOnly = (a) => { const k = partKind(locate(a)[0]); return k === "rom" || k === "divrom" || k === "empty" || k === "flash"; };
function labelAt(a) {
  const [p, o] = locate(a);
  const rl = M.romLabels(p, o); if (rl) return { name: rl[0], synopsis: rl[1], rom: true };
  const cpu = view.mode === "64k" ? a : cpuAddrOf(p, o);
  const ul = cpu !== undefined ? M.userLabels[cpu] : undefined;
  return ul ? { name: ul } : undefined;
}
const allLabels = () => {
  const out = Object.entries(M.userLabels).map(([a, n]) => ({ name: n, cpu: +a }));
  for (const p of M.parts) if (p.rom && ROMS[p.rom]) for (const [o, l] of Object.entries(ROMS[p.rom].labels)) out.push({ name: l[0], part: p.id, off: +o });
  return out;
};

const fmtB = (v) => (v === null ? (ui.radix === "hex" ? "··" : "···") : ui.radix === "hex" ? h2(v) : String(v).padStart(3, "0"));
const fmtA = (a) => (ui.radix === "hex" ? "$" + h4(a) : String(a).padStart(5, "0"));
const cellW = () => (ui.radix === "hex" ? 3 : 4);
const bankColW = () => Math.max(4, ...M.parts.map((p) => p.id.length)) + 0;

function gridCols() {
  const g = ui.labels ? "16ch" : "0";
  const bytesW = ui.width * cellW() + (ui.width > 8 ? Math.floor(ui.width / 8) - 1 : 0);
  return `${g} ${bankColW()}ch 6ch ${bytesW}ch ${ui.chars ? ui.width + 2 + "ch" : "0"} 1fr`;
}
function renderHead() {
  const head = document.getElementById("head");
  head.style.gridTemplateColumns = gridCols();
  let cols = "";
  for (let i = 0; i < ui.width; i++) {
    cols += `<span class="b" style="width:${cellW()}ch">+${ui.radix === "hex" ? i.toString(16).toUpperCase() : i}</span>`;
    if (i % 8 === 7 && i < ui.width - 1) cols += `<span style="width:1ch"></span>`;
  }
  head.innerHTML = `<span style="text-align:right;padding-right:4px">${ui.labels ? "label" : ""}</span><span>${view.mode === "64k" ? "part" : "part"}</span><span>${view.mode === "64k" ? "addr" : "offset"}</span><span class="bytes">${cols}</span><span style="padding-left:8px">${ui.chars ? "chars" : ""}</span><span></span>`;
}

const selRange = () => (ui.anchor === null ? null : [Math.min(ui.anchor, ui.cursor), Math.max(ui.anchor, ui.cursor)]);
function ptrMap() {
  const m = new Map();
  for (const [r, v] of ptrRegs()) {
    let a = v;
    if (view.mode !== "64k") { const reg = regionAt(v); if (reg.part !== view.part) continue; a = reg.off + v - reg.start; }
    if (!m.has(a)) m.set(a, []); m.get(a).push(r);
  }
  return m;
}
function heatOf(a) {
  if (ui.heat === "off") return null;
  const [p, o] = locate(a); const h = M.heat.get(p + ":" + o); if (!h) return null;
  const ks = ui.heat === "exec" ? [0] : ui.heat === "read" ? [1] : ui.heat === "write" ? [2] : [0, 1, 2];
  let best = -1, n = 0; ks.forEach((i) => { if (h[i] > n) { n = h[i]; best = i; } });
  return best < 0 ? null : { cls: ["hx", "hr", "hw"][best], pct: Math.min(55, 14 + Math.log2(n + 1) * 8) };
}

function renderRows() {
  const size = viewSize();
  const rows = Math.ceil(size / ui.width);
  spacerBox.style.height = rows * ROW_H + "px";
  const first = Math.max(0, Math.floor(scroller.scrollTop / ROW_H) - 4);
  const last = Math.min(rows, Math.ceil((scroller.scrollTop + scroller.clientHeight) / ROW_H) + 4);
  const sel = selRange(), ptrs = ptrMap(), cols = gridCols();
  const foundSet = new Set(); ui.found.forEach((f) => { for (let i = 0; i < ui.foundLen; i++) foundSet.add(f + i); });
  let html = "";
  for (let r = first; r < last; r++) {
    const a0 = r * ui.width;
    const [p0] = locate(a0);
    const boundary = view.mode === "64k" && a0 > 0 && regionAt(a0).start === a0;
    let bytes = "", chars = "", tags = [], lab = null;
    for (let i = 0; i < ui.width; i++) {
      const a = a0 + i, v = readAt(a), [p, o] = locate(a);
      const cls = ["b"];
      if (v === null) cls.push("none"); else if (v === 0) cls.push("zero");
      const ht = heatOf(a); if (ht) cls.push("hot", ht.cls);
      if (ptrs.has(a)) { cls.push("ptr"); tags.push(...ptrs.get(a)); }
      if (M.changed.has(p + ":" + o)) cls.push("chg");
      if (foundSet.has(a)) cls.push("found");
      if (sel && a >= sel[0] && a <= sel[1]) cls.push("inSel");
      if (a === ui.cursor) cls.push("cursor");
      if (a === ui.hover) cls.push("hov");
      if (ui.edit && ui.edit.addr === a) cls.push("editing");
      if (ui.flash === a) cls.push("flash");
      if (ui.labels && !lab) { const l = labelAt(a); if (l) lab = l; }
      const txt = ui.edit && ui.edit.addr === a ? (ui.edit.text + "_").padEnd(ui.radix === "hex" ? 2 : 3, "_") : fmtB(v);
      bytes += `<span class="${cls.join(" ")}" data-a="${a}" style="width:${cellW()}ch${ht ? `;--h:${ht.pct}%` : ""}">${txt}</span>`;
      if (i % 8 === 7 && i < ui.width - 1) bytes += `<span style="width:1ch"></span>`;
      if (ui.chars) {
        const ch = v !== null && v >= 32 && v < 127 ? esc(String.fromCharCode(v)) : "·";
        const cc = ["c"]; if (ch === "·") cc.push("dot");
        if (sel && a >= sel[0] && a <= sel[1]) cc.push("inSel");
        if (a === ui.cursor) cc.push("cursor");
        if (a === ui.hover) cc.push("hov");
        if (foundSet.has(a)) cc.push("found");
        chars += `<span class="${cc.join(" ")}" data-a="${a}">${ch}</span>`;
      }
    }
    const tagHtml = [...new Set(tags)].slice(0, 2).map((t) => `<span class="rtag">${t}</span>`).join("");
    const gutter = ui.labels ? `<span class="gutter">${lab ? `<span class="lab" title="${esc(lab.name + (lab.synopsis ? " — " + lab.synopsis : ""))}">${esc(lab.name)}</span>` : ""}${tagHtml}</span>` : "<span></span>";
    const ro = ["rom", "divrom"].includes(partKind(p0));
    html += `<div class="row ${r % 2 ? "" : "even"} ${ro ? "rom" : ""} ${boundary ? "boundary" : ""}" style="top:${r * ROW_H}px;grid-template-columns:${cols}">${gutter}<span class="bank">${p0}</span><span class="addr">${fmtA(a0)}</span><span class="bytes">${bytes}</span><span class="chars">${chars}</span><span></span></div>`;
  }
  spacerBox.innerHTML = html;
}

/* ---------------------------------------------------------------- memory map bar */
function heatLineFor(part, off, len) {
  if (ui.heat === "off") return "";
  let html = `<span class="heatline">`; const n = 24;
  for (let k = 0; k < n; k++) {
    let best = null;
    for (let o = off + Math.floor((k * len) / n); o < off + Math.floor(((k + 1) * len) / n); o++) {
      const h = M.heat.get(part + ":" + o); if (!h) continue;
      const ks = ui.heat === "exec" ? [0] : ui.heat === "read" ? [1] : ui.heat === "write" ? [2] : [0, 1, 2];
      for (const i of ks) if (h[i]) best = i;
    }
    html += `<span style="flex:1;background:${best === null ? "transparent" : `var(--heat-${["exec", "read", "write"][best]})`}"></span>`;
  }
  return html + "</span>";
}
function renderMap() {
  const slots = document.getElementById("slots"), lbl = document.getElementById("viewLbl");
  if (view.mode === "64k") {
    lbl.textContent = "64K view";
    slots.style.gridTemplateColumns = M.regions.map((r) => r.len / 0x2000 + "fr").join(" ");
    let html = M.regions.map((r, i) => {
      const p = M.byId.get(r.part), ro = ["rom", "divrom"].includes(p.kind);
      const half = r.len < p.size ? ` <small>${r.off ? "upper" : "lower"} half</small>` : "";
      return `<div class="slot ${ro ? "rom" : ""} ${p.kind === "empty" ? "empty" : ""}" data-slot="${i}" title="${esc(`${r.cap}: ${p.name}${p.note ? " — " + p.note : ""}${ro ? " (read-only)" : ""}. Click to go to $${h4(r.start)}.`)}"><span class="slotcap">${r.cap}</span><span class="sa">$${h4(r.start)}–$${h4(r.start + r.len - 1)}</span><span class="sb">${p.id}${half || `<small>${esc(p.name)}</small>`}</span>${heatLineFor(r.part, r.off, r.len)}</div>`;
    }).join("");
    for (const [r, v] of ptrRegs()) html += `<span class="tick" title="${r} $${h4(v)}" style="left:${(v / 0x10000) * 100}%"></span>`;
    slots.innerHTML = html + `<span class="viewport" id="vp"></span>`;
  } else {
    const p = M.byId.get(view.part), at = pagedSlots(view.part);
    lbl.textContent = M.unit;
    slots.style.gridTemplateColumns = "1fr";
    slots.innerHTML = `<div class="slot ${["rom", "divrom"].includes(p.kind) ? "rom" : ""} ${p.kind === "empty" ? "empty" : ""}"><span class="slotcap">${esc(p.group.toUpperCase())}</span><span class="sa">${esc(p.name)} · ${p.size / 1024}K${p.note ? " · " + esc(p.note) : ""}${p.bank16 ? " · " + p.bank16 : ""}</span><span class="sb">${p.id}<small>${at.length ? "paged in at " + at.map((i) => M.regions[i].cap.split(" ·")[0]).join(", ") + ` → $${h4(M.regions[at[0]].start - M.regions[at[0]].off)}` : "not paged in"}</small></span>${heatLineFor(p.id, 0, p.size)}</div><span class="viewport thin" id="vp"></span>`;
  }
  updateViewport();
  renderParts();
  document.getElementById("regs").innerHTML = ptrRegs().map(([r, v]) => { const reg = regionAt(v); return `<button class="reg ${ui.follow === r ? "follow" : ""}" data-reg="${r}" title="Go to ${r} = $${h4(v)} (${reg.part}:$${h4(reg.off + v - reg.start)})${M.userLabels[v] ? " — " + M.userLabels[v] : ""}"><b>${r}</b><span>$${h4(v)}</span><em>${reg.part}</em></button>`; }).join("");
  document.getElementById("stMachine").innerHTML = `<b>${esc(M.title)}</b> · Paused`;
  document.getElementById("stPaging").innerHTML = `Paging: ${M.regions.map((r) => `<b>${r.part}</b>`).join(" · ")}`;
}
function renderParts() {
  const el = document.getElementById("parts");
  const chip = (id, extra = "") => {
    const p = M.byId.get(id), at = pagedSlots(id);
    return `<button class="chip ${["rom", "divrom"].includes(p.kind) ? "rom" : ""} ${view.mode === "part" && view.part === id ? "on" : ""}" data-part="${id}" title="${esc(p.name + (p.note ? " — " + p.note : "") + (at.length ? ", paged in" : ", not paged in"))}">${id}${at.length ? `<span class="in">${at.map((i) => M.slotName(i).replace(/^(Slot|Segment|MMU) ?/, "")).join("·")}</span>` : ""}${extra}</button>`;
  };
  let html = `<button class="chip ${view.mode === "64k" ? "on" : ""}" data-part="64k" title="The 64K the CPU sees, with the current paging">64K</button>`;
  if (!M.big) html += M.parts.map((p) => chip(p.id)).join("");
  else {
    const paged = [...new Set(M.regions.map((r) => r.part))];
    html += `<span class="grp">Paged in</span>` + paged.map((id) => chip(id)).join("");
    const recent = ui.recent.filter((id) => !paged.includes(id)).slice(0, 5);
    if (recent.length) html += `<span class="grp">Recent</span>` + recent.map((id) => chip(id)).join("");
    html += `<span class="grp"></span><button class="chip mapbtn ${popOpen() ? "open" : ""}" id="mapBtn" title="All ${M.parts.length} partitions as a map (Ctrl+B)">▦ Bank map <b>${M.parts.length}</b></button>`;
  }
  el.innerHTML = html;
}
function updateViewport() {
  const vp = document.getElementById("vp"); if (!vp) return;
  const rows = Math.ceil(viewSize() / ui.width);
  const top = scroller.scrollTop / ROW_H / rows, h = scroller.clientHeight / ROW_H / rows;
  vp.style.left = `calc(${top * 100}% - 1px)`; vp.style.width = `max(6px, calc(${Math.min(h, 1) * 100}% + 2px))`;
}

/* ---------------------------------------------------------------- bank map popover */
const pop = document.getElementById("pop"), popBody = document.getElementById("popBody"), popFilter = document.getElementById("popFilter");
const popOpen = () => !pop.hidden;
let popKbd = null;
function partMatches(p, q) {
  if (!q) return true;
  q = q.toLowerCase().replace(/^\$/, "");
  const at = pagedSlots(p.id);

});
document.getElementById("goto").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { const t = parseTarget(e.target.value); if (!t) { toast("Not an address, a label, a register or PART:offset"); return; } e.target.value = ""; goToTarget(t); scroller.focus(); }
  if (e.key === "Escape") { e.target.value = ""; scroller.focus(); }
});
document.getElementById("find").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { if (e.target.dataset.last === e.target.value) stepFind(e.shiftKey ? -1 : 1); else { e.target.dataset.last = e.target.value; runFind(e.target.value); } }
  if (e.key === "Escape") { e.target.value = ""; e.target.dataset.last = ""; runFind(""); scroller.focus(); }
});
document.getElementById("findNext").addEventListener("click", (e) => { e.preventDefault(); stepFind(1); });
document.getElementById("findPrev").addEventListener("click", (e) => { e.preventDefault(); stepFind(-1); });

function seg(id, key, after) {
  const el = document.getElementById(id);
  el.addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; ui[key] = b.dataset.v; el.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b)); after?.(b.dataset.v); });
}
seg("widthSeg", "width", (v) => { ui.width = +v; renderHead(); reveal(ui.cursor, true); renderRows(); updateViewport(); });
seg("radixSeg", "radix", () => render());
seg("heatSeg", "heat", () => { renderRows(); renderMap(); });
seg("themeSeg", "theme", (v) => (document.documentElement.dataset.theme = v));
document.getElementById("chars").addEventListener("change", (e) => { ui.chars = e.target.checked; renderHead(); renderRows(); });
document.getElementById("labels").addEventListener("change", (e) => { ui.labels = e.target.checked; renderHead(); renderRows(); });
document.getElementById("follow").addEventListener("change", (e) => { ui.follow = e.target.value; if (ui.follow) followNow(); renderMap(); });
function followNow() { if (view.mode !== "64k") { view.mode = "64k"; render(); } goTo(M.regs[ui.follow], false); }

document.getElementById("mapbar").addEventListener("click", (e) => {
  if (e.target.closest("#pop")) return;
  if (e.target.closest("#mapBtn")) { popOpen() ? closePop() : openPop(); return; }
  const s = e.target.closest("[data-slot]"); if (s) { if (view.mode !== "64k") { view.mode = "64k"; render(); } goTo(M.regions[+s.dataset.slot].start, false); return; }
  const p = e.target.closest("[data-part]"); if (p) { showPart(p.dataset.part); return; }
  const r = e.target.closest("[data-reg]"); if (r) { if (view.mode !== "64k") { view.mode = "64k"; render(); } goTo(M.regs[r.dataset.reg]); }
});

document.getElementById("insp").addEventListener("click", (e) => {
  const act = e.target.closest("[data-act]")?.dataset.act;
  if (e.target.id === "setBtn") {
    const raw = document.getElementById("editVal").value.trim();
    const size = +document.querySelector("#sizeSeg .on").dataset.v, be = document.getElementById("bigEnd").checked;
    let bytes; const t = /^"(.*)"$/.exec(raw);
    if (t) bytes = [...t[1]].map((c) => c.charCodeAt(0) & 0xff);
    else { const tg = parseTarget(raw.replace(/\s+/g, "")); if (!tg) { toast("Not a value"); return; } bytes = Array.from({ length: size }, (_, i) => (tg.addr >> (8 * i)) & 0xff); if (be) bytes.reverse(); }
    bytes.forEach((b, i) => writeAt(ui.cursor + i, b));
    toast(`Wrote ${bytes.length} byte${bytes.length > 1 ? "s" : ""}`); renderRows(); renderInsp(); return;
  }
  if (!act) return;
  const sel = selRange() ?? [ui.cursor, ui.cursor];
  const bytes = []; for (let i = sel[0]; i <= sel[1]; i++) bytes.push(readAt(i) ?? 0);
  const [part, off] = locate(sel[0]);
  const msgs = {
    copyHex: () => { navigator.clipboard?.writeText(bytes.map(h2).join(" ")).catch(() => {}); return "Copied as hex"; },
    copyDefb: () => { navigator.clipboard?.writeText(".defb " + bytes.map((b) => "$" + h2(b)).join(", ")).catch(() => {}); return "Copied as .defb"; },
    findSel: () => { const s = bytes.map(h2).join(" "); document.getElementById("find").value = s; runFind(s); return `Found ${ui.found.length}`; },
    gfx: () => `Mockup: the Graphics Finder would open at ${part}:$${h4(off)}`,
    disass: () => `Mockup: the Disassembly view would reveal ${part}:$${h4(off)}`,
    bpExec: () => `Mockup: bp-set ${part}:$${h4(off)}`,
    bpWrite: () => `Mockup: a memory-write breakpoint on ${part}:$${h4(off)}${sel[1] > sel[0] ? " for " + (sel[1] - sel[0] + 1) + " bytes" : ""}`,
    watch: () => `Mockup: a watch on the word at ${part}:$${h4(off)}`
  };
  toast(msgs[act]());
});

document.getElementById("stepBtn").addEventListener("click", () => {
  M.changed = new Set();
  const loopStart = M.userLabels ? +Object.entries(M.userLabels).find(([, n]) => n === "loop")[0] : 0;
  const d = decode(view.mode === "64k" ? M.regs.PC : 0);
  M.regs.HL = (M.regs.HL + 1) & 0xffff;
  const r = regionAt(M.regs.HL), hp = r.part, ho = r.off + M.regs.HL - r.start, s = M.store(hp);
  if (s) { s[ho] = (s[ho] + 9) & 0xff; M.changed.add(hp + ":" + ho); }
  M.regs.PC = M.regs.PC === loopStart + 5 ? loopStart : (M.regs.PC + d.len) & 0xffff;
  M.regs.BC = (M.regs.BC - 0x100) & 0xffff;
  const pr = regionAt(M.regs.PC); M.addHeat(pr.part, pr.off + M.regs.PC - pr.start, 0, 1);
  if (ui.follow) followNow(); else { renderRows(); renderMap(); renderInsp(); }
  if (popOpen()) renderPop();
  toast(`Stepped to $${h4(M.regs.PC)}: changed bytes are dotted`);
});

function loadMachine(id) {
  M = instantiate(MACHINES[id]());
  view.mode = "64k"; view.part = null; ui.recent = []; ui.anchor = null; ui.found = []; ui.follow = "";
  document.getElementById("findCnt").textContent = "";
  document.getElementById("follow").innerHTML = `<option value="">—</option>` + ptrRegs().map(([r]) => `<option>${r}</option>`).join("");
  // --- A few recently viewed partitions, as a session would have them
  if (M.big) ui.recent = id === "z88" ? ["41", "80", "C0"] : ["12", "0E", "M3"];
  ui.cursor = M.regs.PC; pop.hidden = true; popFilter.value = "";
  render();
  requestAnimationFrame(() => { reveal(ui.cursor, true); renderRows(); updateViewport(); scroller.focus(); });
}
document.getElementById("machineSel").addEventListener("change", (e) => loadMachine(e.target.value));

document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
document.querySelectorAll("#themeSeg button").forEach((b) => b.classList.toggle("on", b.dataset.v === document.documentElement.dataset.theme));
const startMachine = new URLSearchParams(location.search).get("machine") ?? "sp128";
document.getElementById("machineSel").value = MACHINES[startMachine] ? startMachine : "sp128";
loadMachine(document.getElementById("machineSel").value);
</script>
</body>
</html>
